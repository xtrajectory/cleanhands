<head data-page-node-id="mY1XvE64vFFIRFEzNijn7k">
    <meta charset="UTF-8" data-page-node-id="buwygNDFSjP9shJ09zXEgc">

    <title>Cleanhands page</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=160&id=0WINekHENi8b&format=png" sizes="96x96" data-page-node-id="aJd0LkbD1MnCKIeTExdlPv">
    <style>
        /* === 全局變量與基礎設置 === */
        :root {
            --bg-color: black;
            --text-color: white;
            --primary-color: orange;
            --accent-color: #C6A300;
            --glass-bg: rgba(30, 30, 30, 0.8);
            --glass-border: rgba(255, 255, 255, 0.15);
            --grey-text: #aaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 底部留白：預留固定按鈕列的高度，避免內容被列遮蔽（實際值由 JS 依列高精算覆寫） */
            padding: 20px 0 130px 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        /* === Hero 時間顯示區 === */
        .hero-section {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease-out;
            margin-top: 40px;
        }

        .hero-time {
            font-size: 4.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(198, 163, 0, 0.3);
            font-variant-numeric: tabular-nums;
        }

        .hero-date {
            font-size: 2rem;
            color: var(--primary-color);
            margin-top: 10px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        h1 {
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 1px;
            display: inline-block;
        }

        /* === 標題列：標題框置中，定位圖示置於框外 === */
        .title-row {
            width: 100%;
            text-align: center;
            margin-bottom: 25px;
        }
        .title-row h1 { margin-bottom: 0; }
        .title-box {
            position: relative;
            display: inline-block;
        }

        .locate-btn {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            margin-left: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            line-height: 0;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .locate-btn:hover { transform: translateY(-50%) scale(1.25); }
        .locate-btn:active { transform: translateY(-50%) scale(0.88); }

        /* === 主結果顯示區 (強化優化版) === */
        #result {
            margin-top: 10px;
            padding: 30px 50px;
            border: 2px solid rgba(198, 163, 0, 0.4);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(40, 40, 40, 0.9), rgba(20, 20, 20, 0.9));
            box-shadow: 0 15px 50px rgba(198, 163, 0, 0.15);
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.6s ease-out;
        }

        .res-label {
            color: #ff4d4d;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .res-main-date {
            font-size: 42px;
            color: #ffffff;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .res-weekday {
            font-size: 24px;
            color: var(--primary-color);
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* === 按鈕區域 === */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            width: 95%;
            max-width: 800px;
            flex-wrap: nowrap;
        }

        .button-container button {
            background-color: var(--glass-bg);
            color: #ddd;
            font-size: 15px;
            border: 1px solid var(--glass-border);
            padding: 12px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 10px;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .button-container button:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
            color: white;
            transform: translateY(-2px);
        }

        /* === 結果展示卡片 === */
        .result-box {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 35px;
            margin: 30px auto;
            width: fit-content;
            max-width: 95vw;
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.4s ease-out;
            box-sizing: border-box;
            display: block;
        }

        /* === 未來五天表格 === */
        .modern-table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        
        .modern-table th {
            text-align: center;
            color: var(--grey-text);
            font-size: 13px;
            padding: 0 15px 10px 15px;
            border-bottom: 1px solid var(--glass-border);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .modern-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
            white-space: nowrap;
            text-align: center;
        }

        .modern-table tr:last-child td { border-bottom: none; }

        .date-start { color: #ccc; }
        .arrow { color: #666; font-size: 14px; padding: 0 5px; }
        .date-end { color: var(--primary-color); font-weight: bold; }
        .header-highlight { color: var(--accent-color); font-weight: bold; }

        /* === 驗算列表 === */
        .verify-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            gap: 40px;
            white-space: nowrap;
        }

        .verify-days-count { font-size: 32px; color: var(--accent-color); font-weight: bold; }
        .verify-days-label { color: var(--grey-text); font-size: 14px; }
        
        .verify-subtitle {
            text-align: left;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            white-space: nowrap;
        }

        .timeline-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .timeline-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
            gap: 20px;
        }

        .timeline-left { display: flex; align-items: center; gap: 12px; }

        .timeline-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: #ff4d4d;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.6);
            flex-shrink: 0;
        }

        .timeline-date { color: #fff; font-size: 15px; }
        .timeline-reason { color: #ff6666; font-size: 14px; text-align: right; flex-shrink: 0; white-space: nowrap; }
        .timeline-empty { color: #4CAF50; text-align: center; padding: 15px; font-style: italic; white-space: nowrap; }

        /* 驗算框：依假期文字長度自動增寬，避免橫向滾動 */
        .result-box.verify-box {
            width: max-content;
            max-width: 95vw;
            min-width: min(320px, 95vw);
            overflow-x: visible;
        }
        .result-box.verify-box .timeline-list {
            overflow-x: visible;
        }

        
        /* === 月曆樣式 === */
        .calendar-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }
        .calendar-month {
            min-width: 240px;
            flex: 1 1 auto;
            max-width: 320px;
        }
        .calendar-month-header {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            padding: 6px 0;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            letter-spacing: 1px;
        }
        .calendar-table {
            border-collapse: collapse;
            width: 100%;
        }
        .calendar-table th {
            color: #888;
            font-size: 12px;
            padding: 5px 6px;
            text-align: center;
            font-weight: 400;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .calendar-table td {
            padding: 4px 3px;
            text-align: center;
            font-size: 13px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .calendar-day {
            color: #ccc;
        }
        .calendar-today {
            outline: 2px solid rgba(255,255,255,0.35);
            outline-offset: -2px;
            border-radius: 4px;
        }
        .calendar-bg {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            line-height: 1.3;
        }
        .calendar-yellow {
            color: #000 !important;
            font-weight: 700;
        }
        .calendar-bg.calendar-yellow {
            background-color: #FFD700;
        }
        .calendar-red {
            color: #fff !important;
            font-weight: 700;
        }
        .calendar-bg.calendar-red {
            background-color: #E53935;
            box-shadow: 0 0 8px rgba(229,57,53,0.5);
        }
        .calendar-purple {
            color: #fff !important;
            font-weight: 700;
            cursor: pointer;
        }
        .calendar-bg.calendar-purple {
            background-color: #9C27B0;
        }
        .calendar-legend {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            font-size: 12px;
            color: #ccc;
        }
        .calendar-legend-item { display: flex; align-items: center; gap: 6px; }
        .calendar-legend-swatch { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
        .calendar-tooltip {
            position: fixed;
            background: #1a1a2e;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 9999;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 260px;
            line-height: 1.4;
            pointer-events: none;
            white-space: nowrap;
        }
        .calendar-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border: 5px solid transparent;
            border-top-color: #1a1a2e;
        }


        /* === 底部導航列 ===
           電腦與手機一致：固定貼齊視窗最下緣。兩列共用同一組欄寬（4 個按鈕 + 1 個固定寬度的尾欄），確保上下對齊 */
        .map-button-container {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px 20px calc(8px + env(safe-area-inset-bottom, 0px));
            background-color: rgba(0, 0, 0, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            box-sizing: border-box;
        }

        .map-button-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr)) 30px;
            gap: 8px;
            width: 100%;
            /* 每個按鈕寬度為原設計的 3/4（139.5px → 105px） */
            max-width: 480px;
            margin-left: auto;   /* 整列靠右下排列，維持「右下角」的操作習慣 */
            align-items: center;
        }

        #hiddenRow {
            display: none;
            width: 100%;
            animation: slideUp 0.3s ease-out;
        }

        .map-button {
            background-color: #977C00;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 8px;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .map-button:active { transform: scale(0.95); }
        .map-button-row a { text-decoration: none; display: flex; min-width: 0; }
        .map-button-row a button { width: 100%; }

        /* === 收合鈕：立體深灰 ▼（7 秒一次反光；展開時先反轉、再漸變為棕色） === */
        #toggleBtn {
            background: transparent;
            border: none;
            box-shadow: none;
            width: 100%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transform-origin: 50% 50%;
            /* 反轉較快（0.34s）且帶極輕微回彈；顏色漸變延後 0.3s 才開始，形成「先反轉、後變色」 */
            transition: transform 0.34s cubic-bezier(0.34, 1.32, 0.64, 1);
        }

        #toggleBtn .chev {
            display: block;
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 1.5px 1.1px rgba(0, 0, 0, 0.8));
        }

        /* 深灰立體本體（底層，常駐） */
        #toggleBtn .chev-body-grey { opacity: 1; }

        /* 棕色本體（上層），僅在展開時淡入 */
        #toggleBtn .chev-body-brown {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #toggleBtn.rotated .chev-body-brown {
            opacity: 1;
            transition-delay: 0.3s;
        }

        /* 反光帶：每 7 秒由左至右掠過一次（以三角形為遮罩，不會溢出外形） */
        #toggleBtn .chev-shine {
            animation: chevShine 7s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes chevShine {
            0%   { transform: translateX(-30px); }
            18%  { transform: translateX(30px); }
            100% { transform: translateX(30px); }
        }

        #toggleBtn:hover { transform: scale(1.1); }
        #toggleBtn.rotated { transform: rotate(180deg) scale(1.1); }
        #toggleBtn.rotated:hover { transform: rotate(180deg) scale(1.18); }

        @media (prefers-reduced-motion: reduce) {
            #toggleBtn .chev-shine { animation: none; opacity: 0; }
            #toggleBtn .chev-body-brown { transition-delay: 0s; transition-duration: 0.01s; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-info {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 12px;
        }

        #disclaimer { margin: 0; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* === 手機適配 === */
        @media (max-width: 768px) {
            .hero-time { font-size: 3.5rem; }
            .hero-date { font-size: 1.5rem; }
            
            .res-main-date { font-size: 32px; }
            .res-weekday { font-size: 20px; }

            .result-box { max-width: 95%; overflow-x: auto; }
            .result-box.verify-box { max-width: 95vw; overflow-x: visible; width: max-content; }
            
            .button-container {
                gap: 8px; 
                padding: 0 10px;
            }
            
            .button-container button {
                font-size: 13px;
                padding: 10px 2px;
            }

            body {
                /* 手機維持滿版底欄；底部留白再加上 iPhone 底部安全區（Home Indicator） */
                padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
            }

            .map-button-container {
                padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
                gap: 6px;
            }

            .map-button-row {
                grid-template-columns: repeat(4, minmax(0, 1fr)) 25px;
                gap: 5px;
                width: 100%;
                max-width: none;   /* 手機：按鈕列維持滿版 */
            }

            .map-button {
                font-size: 12.5px;
                padding: 0 4px;
                height: 36px;
                width: 100%;
                letter-spacing: -0.2px;
            }

            #toggleBtn { width: 100%; padding: 0; margin: 0; }
            #toggleBtn .chev { width: 19px; height: 19px; }
        }
    </style>

</head>

    function formatDateKey(date) { 
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function checkRestDay(date) {
        const dayOfWeek = date.getDay();
        const dateStr = formatDateKey(date); 
        if (dayOfWeek === 0) return { isRestDay: true, reason: "星期日" };
        if (dayOfWeek === 6) return { isRestDay: true, reason: "星期六" };
        if (SPECIAL_HOLIDAYS[dateStr]) return { isRestDay: true, reason: SPECIAL_HOLIDAYS[dateStr] };
        return { isRestDay: false, reason: "" };
    }

    function calculateWorkdayDate(startDate, daysToAdd) {
        let targetDate = new Date(startDate.getTime());
        targetDate.setHours(12, 0, 0, 0);
        targetDate.setDate(targetDate.getDate() + daysToAdd);

        let logs = [];
        while (true) {
            const status = checkRestDay(targetDate);
            if (status.isRestDay) {
                logs.push({ dateStr: formatDateKey(targetDate), dateObj: new Date(targetDate), reason: status.reason });
                targetDate.setDate(targetDate.getDate() + 1);
            } else { break; }
        }
        return { date: targetDate, logs: logs };
    }

        const now = new Date();

        const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${WEEKDAYS[now.getDay()]}`;
        document.getElementById('heroTime').textContent = timeStr;
        document.getElementById('heroDate').textContent = dateStr;

    function generateCalendarHTML(startDate, endDate) {
        const yellowDates = new Set();
        const redDateKey = formatDateKey(endDate);
        let d = new Date(startDate);
        d.setDate(d.getDate() + 1);
        d.setHours(0,0,0,0);
        const end = new Date(endDate);
        end.setHours(0,0,0,0);
        while (d <= end) {
            yellowDates.add(formatDateKey(d));
            d.setDate(d.getDate() + 1);
        }
        const months = [];
        let cur = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
        const lastMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
        while (cur <= lastMonth) {
            months.push({ year: cur.getFullYear(), month: cur.getMonth() });
            cur.setMonth(cur.getMonth() + 1);
        }
        const todayKey = formatDateKey(new Date());
        let html = '<div class="calendar-wrapper">';
        months.forEach(m => {
            const year = m.year, month = m.month;
            html += '<div class="calendar-month"><div class="calendar-month-header">' + year + '年' + (month+1) + '月</div>';
            html += '<table class="calendar-table"><thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead><tbody>';
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startDow = new Date(year, month, 1).getDay();
            let day = 1;
            let done = false;
            for (let row = 0; !done; row++) {
                html += '<tr>';
                for (let col = 0; col < 7; col++) {
                    if ((row === 0 && col < startDow) || day > daysInMonth) {
                        html += '<td></td>';
                    } else {
                        const dateObj = new Date(year, month, day);
                        const dk = formatDateKey(dateObj);
                        let tdCls = 'calendar-day';
                        if (dk === todayKey) tdCls += ' calendar-today';
                        var bgCls = '';
                        if (dk === redDateKey) bgCls = 'calendar-red';
                        else if (SPECIAL_HOLIDAYS[dk] && yellowDates.has(dk)) bgCls = 'calendar-purple';
                        else if (yellowDates.has(dk)) bgCls = 'calendar-yellow';
                        var extras = '';
                        if (SPECIAL_HOLIDAYS[dk] && (yellowDates.has(dk) || dk === redDateKey)) {
                            extras = ' data-date="' + dk + '" data-holiday="' + SPECIAL_HOLIDAYS[dk] + '"';
                        }
                        if (bgCls) {
                            html += '<td class="' + tdCls + '"' + extras + '><span class="calendar-bg ' + bgCls + '">' + day + '</span></td>';
                        } else {
                            html += '<td class="' + tdCls + '">' + day + '</td>';
                        }
                        if (day++ >= daysInMonth) done = true;
                    }
                }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
        });
        html += '</div>';
        html += '<div class="calendar-legend">';
        html += '<div class="calendar-legend-item"><div class="calendar-legend-swatch" style="background:#FFD700"></div><span>計算期間</span></div>';
        html += '<div class="calendar-legend-item"><div class="calendar-legend-swatch" style="background:#E53935"></div><span>第十五天</span></div>';
        html += '<div class="calendar-legend-item"><div class="calendar-legend-swatch" style="background:#9C27B0"></div><span>假日</span></div>';
        html += '<div class="calendar-legend-item"><div class="calendar-legend-swatch" style="outline:2px solid rgba(255,255,255,0.35);outline-offset:-2px;background:transparent"></div><span>今天</span></div>';
        html += '</div>';
        return html;
    }

    function toggleVerification() {
        const verifyDiv = document.getElementById('verificationResult');

            verifyDiv.style.display = 'none';

            const result = calculateWorkdayDate(today, CONFIG.daysToAdd);
            const endDate = result.date;
            
            const d1 = new Date(today); d1.setHours(0,0,0,0);
            const d2 = new Date(endDate); d2.setHours(0,0,0,0);
            const totalDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
            
            let html = `<div class="result-box verify-box"><div class="verify-summary"><div class="verify-days-label">總跨度天數</div><div class="verify-days-count">${totalDays} 天</div></div>`;
            
            if (result.logs.length > 0) {
                html += `<div class="verify-subtitle">第${CONFIG.daysToAdd}天遇到以下假期，需要順延：</div>`;
                html += `<div class="timeline-list">`;
                result.logs.forEach(log => {
                    const dateShort = `${log.dateObj.getFullYear()}/${log.dateObj.getMonth()+1}/${log.dateObj.getDate()}`;
                    const weekDayShort = WEEKDAYS[log.dateObj.getDay()].replace('星期','');
                    html += `<div class="timeline-row"><div class="timeline-left"><span class="timeline-dot"></span><span class="timeline-date">${dateShort} (${weekDayShort})</span></div><span class="timeline-reason">${log.reason}</span></div>`;
                });
                html += `</div>`;
            } else { 
                html += `<div class="timeline-empty">⭕期間無任何假期或週末，無需順延。</div>`; 
            }
            html += generateCalendarHTML(today, endDate);
            html += `</div>`;
            verifyDiv.innerHTML = html;
            verifyDiv.style.display = 'block';
        }
    }

    function export120DaysTable() {
        try {
            const rows = [];
            rows.push('<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">');
            rows.push('<Styles><Style ss:ID="Default"><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style></Styles><Worksheet ss:Name="Sheet1"><Table ss:DefaultColumnWidth="100">');
            rows.push('<Row>');
            for(let k=0; k<4; k++) { rows.push('<Cell ss:StyleID="Default"><Data ss:Type="String">日期</Data></Cell><Cell ss:StyleID="Default"><Data ss:Type="String">' + CONFIG.daysToAdd + '日</Data></Cell>'); }
            rows.push('</Row>');
            const today = new Date();
            const totalDays = 120;
            const rowsNeeded = Math.ceil(totalDays / 4);
            for (let r = 0; r < rowsNeeded; r++) {
                rows.push('<Row>');
                for (let c = 0; c < 4; c++) {
                    const dayOffset = r + (c * rowsNeeded);
                    if (dayOffset < totalDays) {
                        const currentDate = new Date(today.getTime() + dayOffset * 86400000);
                        const res = calculateWorkdayDate(currentDate, CONFIG.daysToAdd);
                        rows.push(`<Cell ss:StyleID="Default"><Data ss:Type="String">${formatDateKey(currentDate)}</Data></Cell><Cell ss:StyleID="Default"><Data ss:Type="String">${formatDateKey(res.date)}</Data></Cell>`);
                    } else { rows.push('<Cell ss:StyleID="Default"><Data ss:Type="String"></Data></Cell><Cell ss:StyleID="Default"><Data ss:Type="String"></Data></Cell>'); }
                }
                rows.push('</Row>');
            }
            rows.push('</Table></Worksheet></Workbook>');
            const blob = new Blob([rows.join('\n')], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `120days_calculation_${new Date().getFullYear()}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        } catch (error) { console.error('導出失敗:', error); alert('導出失敗，請查看控制台'); }
    }

    // === 標題右側：一鍵直接開啟 Google 地圖 App（不彈出任何提示） ===
    // 設計原則：
    //   1. 不呼叫 Geolocation API —— 避免「網站要求取用您的位置」權限詢問框；
    //      圖示改為真實 <a>，href 於載入時依平台填入，讓開啟動作發生在使用者點擊的當下。
    //   2. iOS Safari 以 transient activation 判定是否為使用者手勢：只要在 geolocation 等非同步
    //      回呼中才導向，手勢就失效，iOS 便會彈出「在『Google 地圖』中打開此頁面？」確認框。
    //      因此必須「同步」導向，才能無提示直接開啟 App。
    //   3. 不設計時器後備：App 冷啟動較慢會被誤判，且先前因此產生多餘的網頁分頁。
    //      改由平台原生的後備機制處理（Android intent:// 的 S.browser_fallback_url）。
    //   4. Google 地圖 App 開啟後本來就會顯示目前位置，無須由網頁傳入座標。
    const GMAP = {
        // iOS：Google 地圖 App 專屬協定，無參數即開啟 App 首頁（App 自行定位）
        iosApp: 'comgooglemaps://',
        // iOS 替代方案（若實測仍出現確認框，把下行改為 true 即可改用 Universal Link，
        // 缺點是可能被 Safari 直接開啟網頁而不交給 App）
        iosUseUniversalLink: false,
        iosUniversalLink: 'https://maps.google.com/maps?q=My+Location',
        // 桌面或其他平台
        web: 'https://www.google.com/maps/',
        androidPackage: 'com.google.android.apps.maps'
    };

    // 依平台產生目標網址，於頁面載入時寫入 <a> 的 href
    function resolveMapUrl() {
        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);

        if (isIOS) {
            return GMAP.iosUseUniversalLink ? GMAP.iosUniversalLink : GMAP.iosApp;
        }

        if (isAndroid) {
            var isChromium = /Chrome\/|Chromium\/|SamsungBrowser\//i.test(ua) && !/EdgA|OPR|Opera/i.test(ua);
            if (isChromium) {
                // intent:// 明確指定套件名稱 → 系統直接交給 Google 地圖，不會出現「選擇應用程式」清單；
                // 未安裝時由 S.browser_fallback_url 導向網頁版，也不會顯示錯誤
                return 'intent://maps.google.com/maps' +
                       '#Intent;scheme=https;package=' + GMAP.androidPackage +
                       ';S.browser_fallback_url=' + encodeURIComponent(GMAP.web) + ';end';
            }
            // 其他 Android 瀏覽器：geo: 為系統標準協定，交由地圖 App 顯示目前位置
            return 'geo:0,0?q=My+Location';
        }

        return GMAP.web;
    }

    function initLocateButton() {
        document.getElementById('locateBtn').href = resolveMapUrl();
    }

    // === 底部導航欄折疊邏輯 ===
    function initNavToggle() {
        const toggleBtn = document.getElementById('toggleBtn');
        const hiddenRow = document.getElementById('hiddenRow');
        const navContainer = document.getElementById('navContainer');
        let isOpen = false;

        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            isOpen = !isOpen;
            toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            
            if (isOpen) {
                hiddenRow.style.display = 'grid';
                toggleBtn.classList.add('rotated');
            } else {
                hiddenRow.style.display = 'none';
                toggleBtn.classList.remove('rotated');
            }
        });

        document.addEventListener('click', function(e) {
            if (isOpen && !navContainer.contains(e.target)) {
                isOpen = false;
                toggleBtn.setAttribute('aria-expanded', 'false');
                hiddenRow.style.display = 'none';
                toggleBtn.classList.remove('rotated');
            }
        });
    }

    // === 依「展開後」的實際列高回推 <body> 底部留白 ===
    // 用途：固定底欄必然會浮在內容之上，因此需在文件尾端預留等高的空間，
    //      否則捲到最底時，最後一段內容仍會被按鈕列蓋住。
    // 注意：一律以「展開狀態」量測，這樣展開時留白不會變動，
    //      內容也就不會在點擊收合鈕時突然位移（js 只影響 padding，不造成重排跳動）。
    function syncNavSpacer() {
        const nav = document.getElementById('navContainer');
        const hiddenRow = document.getElementById('hiddenRow');
        if (!nav || !hiddenRow) return;

        const prevDisplay = hiddenRow.style.display;
        const prevVisibility = hiddenRow.style.visibility;

        hiddenRow.style.display = 'grid';
        hiddenRow.style.visibility = 'hidden';   // 只為量測而展開，不顯示，避免畫面閃動
        const fullHeight = nav.getBoundingClientRect().height;
        hiddenRow.style.display = prevDisplay || 'none';
        hiddenRow.style.visibility = prevVisibility || '';

        document.body.style.paddingBottom = Math.ceil(fullHeight + 20) + 'px';
    }

    function init() {
        document.getElementById('titleText').textContent = CONFIG.titles[Math.floor(Math.random() * CONFIG.titles.length)];
        updateTimeDisplays();
        updateMainDisplay();
        initLocateButton();
        initNavToggle(); 
        syncNavSpacer();
        window.addEventListener('resize', syncNavSpacer);
        setInterval(updateTimeDisplays, 1000);
        setInterval(updateMainDisplay, 60000);
    }
    init();
    </script>
