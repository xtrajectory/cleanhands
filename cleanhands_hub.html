<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script>
  /* 手機版固定為裝置寬度並禁止放大：iOS Safari 10+ 會忽略 user-scalable=no，
     故另外攔截其專有的雙指手勢；touch-action 則由下方 CSS 停用雙擊縮放。 */
  (function () {
    function block(e) { e.preventDefault(); }
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
      document.addEventListener(n, block, { passive: false });
    });
  })();
</script>
<script>
  /* 於首次繪製前先套用系統偏好，避免深色系統出現淺色閃光（FOUC） */
  (function () {
    try {
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef3fa">
<title>cleanhands_hub</title>
<meta name="description" content="旅遊局旅遊快訊活動資訊、市政署餐飲場所名單與旅遊局五類牌照場所資訊，以及交通事務局全澳巴士站與行經路線查詢。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1c30'/%3E%3Ctext x='32' y='44' font-size='34' font-family='serif' fill='%234fd1bd' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --header-h: 62px;
    --bg: #080e19;
    --bg-glow: rgba(79, 209, 189, .13);
    --surface: #101a2b;
    --surface-2: #16223a;
    --surface-3: #1b2942;
    --border: #22304a;
    --border-soft: #1a2740;
    --text: #e9f0fb;
    --muted: #93a7c4;
    --faint: #6b819f;
    --accent: #4fd1bd;
    --accent-2: #f4bd6a;
    --shadow: 0 24px 60px rgba(2, 8, 18, .55);
    --radius: 18px;
  }
  html[data-theme="light"] {
    --bg: #eef3fa;
    --bg-glow: rgba(15, 140, 114, .10);
    --surface: #ffffff;
    --surface-2: #f4f8fd;
    --surface-3: #e9f0f9;
    --border: #dbe5f1;
    --border-soft: #e6eef8;
    --text: #101d33;
    --muted: #52678a;
    --faint: #7c90ad;
    --accent: #0f8c72;
    --accent-2: #a56809;
    --shadow: 0 20px 48px rgba(21, 43, 74, .10);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  /* 版面寬度鎖定為裝置寬度；停用自動字級調整、雙指與雙擊放大 */
  html {
    width: 100%; max-width: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    touch-action: pan-x pan-y;
  }

  body {
    margin: 0;
    width: 100%; max-width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
                 "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color .25s ease, color .25s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 480px at 50% -12%, var(--bg-glow), transparent 70%),
      radial-gradient(700px 400px at 92% 8%, rgba(244, 189, 106, .07), transparent 72%);
  }

  .shell {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 32px);
    position: relative;
    z-index: 1;
  }

  a { color: inherit; }

  .skip {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--accent);
    color: #04121a;
    padding: 10px 16px;
    border-radius: 0 0 10px 0;
    font-weight: 700;
    text-decoration: none;
    z-index: 100;
  }
  .skip:focus { left: 0; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------------- 頁首 ---------------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 62px;
    padding-block: 9px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .brand-text strong { font-size: 17.5px; letter-spacing: .04em; white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .macau-clock {
    display: flex; align-items: baseline; gap: 7px;
    font-variant-numeric: tabular-nums;
    font-size: 17px; font-weight: 700; letter-spacing: .05em;
    color: var(--text);
  }
  .macau-clock small { font-size: 12px; font-weight: 500; color: var(--faint); letter-spacing: .06em; }

  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: color .18s, border-color .18s, transform .18s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { width: 17px; height: 17px; }
  html[data-theme="dark"] .icon-sun { display: block; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="light"] .icon-sun { display: none; }
  html[data-theme="light"] .icon-moon { display: block; }

  /* ---------------- 分類切換按鈕（捲動時固定在頁首下方） ---------------- */
  .view-tabs {
    position: sticky;
    top: var(--header-h);
    z-index: 25;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
    margin-top: clamp(14px, 2vw, 20px);
    margin-bottom: clamp(16px, 2vw, 22px);
    padding-block: 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border-bottom: 1px solid var(--border-soft);
    border-radius: 0 0 14px 14px;
  }
  .view-tab {
    flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    color: var(--muted);
    font: inherit;
    font-size: 14.5px; font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s, border-color .18s, background-color .18s, transform .18s;
  }
  .view-tab:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .view-tab:active { transform: translateY(1px); }
  .view-tab.is-active {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
  }
  html[data-theme="light"] .view-tab.is-active {
    color: #0a6b56;
    border-color: rgba(15, 118, 92, .42);
    background: rgba(15, 140, 114, .10);
  }
  .view-tab .tab-ico { width: 18px; height: 18px; border-radius: 4px; object-fit: contain; flex: none; }
  .view-tab .tab-ico + .tab-ico { margin-left: -4px; }
  /* 牌照場所的兩枚標誌（旅遊局 MGTO、市政署 IAM）一律以原圖顏色顯示，不隨主題反相 */

  /* 全站唯一的重新整理按鈕（頁首「澳門時間」右方，僅顯示圖示） */
  .refresh-btn {
    flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    padding: 0;
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border));
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--accent);
    cursor: pointer;
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
    transition: border-color .18s, background-color .18s, transform .18s, opacity .18s;
  }
  .refresh-btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
  .refresh-btn:active { transform: translateY(1px); }
  .refresh-btn:disabled { opacity: .62; cursor: default; transform: none; }
  .refresh-btn svg { width: 17px; height: 17px; flex: none; }
  .refresh-btn.is-busy svg { animation: wb-spin .9s linear infinite; }
  .refresh-btn [data-refresh-label] { display: none; }
  @keyframes wb-spin { to { transform: rotate(360deg); } }
  /* 淺色底提高文字對比，維持至少 WCAG AA */
  html[data-theme="light"] .refresh-btn {
    color: #0a6b56;
    border-color: rgba(15, 118, 92, .42);
    background: rgba(15, 140, 114, .10);
  }
  html[data-theme="light"] .refresh-btn:hover {
    border-color: #0f8c72;
    background: rgba(15, 140, 114, .18);
  }

  .tour-panel, .registry-panel, .bus-panel { margin-bottom: clamp(18px, 2.4vw, 26px); }

  /* ---------------- 頁尾 ---------------- */
  .site-footer {
    margin-top: clamp(36px, 6vw, 60px);
    padding: 22px 0 34px;
    border-top: 1px solid var(--border-soft);
    font-size: 13.5px;
    color: var(--faint);
  }
  .footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .footer-inner p { margin: 0; max-width: 66ch; line-height: 1.7; }
  .footer-tag {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: auto;
    color: var(--muted);
    font-size: 13.5px; font-weight: 600; letter-spacing: .06em;
    white-space: nowrap;
  }
  .footer-tag .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .site-footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .site-footer a:hover { color: var(--accent); }

  @media (max-width: 560px) {
    :root { --header-h: 56px; }
    .header-inner { min-height: 56px; gap: 8px; }
    .header-right { gap: 8px; }
    .brand-text small { display: none; }
    .macau-clock small { display: none; }
    .macau-clock { font-size: 15.5px; }
    .refresh-btn { width: 32px; height: 32px; }
    .refresh-btn svg { width: 15px; height: 15px; }
    .view-tabs {
      padding-block: 8px;
      gap: 7px;
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scroll-padding-inline: clamp(16px, 4vw, 32px);
      scrollbar-width: none;
    }
    .view-tabs::-webkit-scrollbar { display: none; }
    .view-tab { padding: 7px 12px; font-size: 13.5px; scroll-snap-align: start; }
    .footer-tag { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  @media print {
    body::before, .site-header, .refresh-btn { display: none; }
    .view-tabs { position: static; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; }
  }
</style>

<header class="site-header">
  <div class="shell header-inner">
    <div class="brand">
      <span class="brand-text">

    <div class="header-right">
      <span class="macau-clock" aria-label="澳門時間">
        <span id="header-clock">--:--:--</span>
        <small>澳門時間</small>
      </span>
      <button class="refresh-btn" id="global-refresh" type="button"
              aria-label="重新整理全部資訊" title="重新整理全部資訊（旅遊快訊、牌照場所）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切換深色／淺色模式" title="切換深色／淺色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="shell view-tabs" aria-label="資訊分類">
  <button class="view-tab" type="button" data-view="bus" aria-pressed="false" aria-controls="view-bus">巴士站</button>
  <button class="view-tab is-active" type="button" data-view="registry" aria-pressed="true" aria-controls="view-registry"><img class="tab-ico" src="https://www.macaotourism.gov.mo/static/logo/mgto.svg" alt=""><img class="tab-ico" src="https://www.gov.mo/zh-hant/wp-content/uploads/sites/4/2021/01/IAM-logo_2019-_C03-300x300.png" alt="">牌照場所</button>

<script>
/**
 * macau-tour-widget.js
 * 「澳門旅遊快訊」按鈕分類所對應的活動資訊元件（旅遊局 What's On）
 *
 * 使用者提供的目錄 API（政府數據開放平台，非阻塞讀取資料集描述）：
 *   https://api.data.gov.mo/document/download/aae52fd8-3d52-47ae-9b0d-bc77ec6ac232?token=g9MPxYmUloV6AusgTLbYJz1PvlvJ9wo9&isNeedFile=0&lang=TC
 *   該目錄 2019 年登錄、2020 年最後更新，回傳的 url[] 為舊版 RSS：
 *     https://whatson.macaotourism.gov.mo/rss/whatson_tc.xml
 *   實測（2026-11-10）舊 RSS 已回 403 Forbidden，且整域 302 導向新官網，
 *   因此實際活動資料改讀新官網現行端點。
 *
 * 現行資料端點（繁體中文，184 筆／月）：
 *   https://www.macaotourism.gov.mo/api/enf/whatson?lang=zh-hant
 *   欄位：results[] = id / name / showDate / eventDate / eventDateRange /
 *         types[] / location[] / shortDesc / thumbnail / top / month；
 *         top.introduction = 本月焦點標題與說明。
 *   該端點 Access-Control-Allow-Origin 固定為官網自身，瀏覽器由本機 HTML
 *   無法直接讀取，故第一順位經公開文字代理 r.jina.ai 轉取（回傳原始 JSON，
 *   前面附 Title／URL Source／Markdown Content 三行，解析時由第一個「{」起算）；
 *   代理失敗再試官網直連（供同源部署使用），兩者皆失敗使用內建官方快照。
 *
 * 內建快照：2026-11-10 由上述繁中端點取得之前 24 筆活動，僅供離線顯示；
 *   即時資料成功即以完整 184 筆取代。不使用 localStorage，避免記憶狀態。
 * 本月焦點保留官方完整說明（不截斷），預設顯示 3 行，點「更多」展開全文、
 *   點「收起」復原；七枚分類按鈕固定 7 欄單一橫列（窄欄為名稱在上、數量在下），
 *   任何寬度都不換行、不需左右滑動。分類文字放大時，四字名稱僅在框內折行，
 *   欄寬、間距與位置維持不變，極窄螢幕另有字級斷點避免裁切。
 *
 * 可用屬性：refresh（秒，預設 300）／theme／title／limit
 * 公開方法：element.refresh()
 * 對外事件：macau-tour:update、macau-tour:error（bubbles + composed）
 * 介面不出現「資料來源／查看資料集」文字（沿用全站既有偏好）。
 */
(function () {
  'use strict';

  if (window.customElements && window.customElements.get('macau-tour-widget')) return;

  var CATALOG_API = 'https://api.data.gov.mo/document/download/aae52fd8-3d52-47ae-9b0d-bc77ec6ac232' +
    '?token=g9MPxYmUloV6AusgTLbYJz1PvlvJ9wo9&isNeedFile=0&lang=TC';
  var OFFICIAL_API = 'https://www.macaotourism.gov.mo/api/enf/whatson?lang=zh-hant';
  var PROXY_API = 'https://r.jina.ai/' + OFFICIAL_API;
  var DETAIL_BASE = 'https://www.macaotourism.gov.mo/zh-hant/events/whatson/';
  var SNAPSHOT_DATE = '2026-11-10';
  var PAGE_SIZE = 9;

    _shell() {

          '<span class="badge" data-badge>載入中…</span></div>' +

          '<p data-focus-desc></p>' +

            '<button class="focus-more" type="button" data-focus-more aria-expanded="false">更多</button>' +
          '</div></div>' +
          '<div class="tools"><label class="search">' + SEARCH_SVG +
            '<input type="search" data-search placeholder="搜尋活動名稱／地點／內容" aria-label="搜尋旅遊快訊">' +
          '</label></div>' +
          '<div class="chips" data-chips></div>' +
          '<div class="result" data-result></div>' +
          '<div class="list" data-list></div>' +
          '<button class="more" type="button" data-more hidden></button>' +
          '<div class="notice" data-notice hidden></div>' +
        '</div>';
      var t = this.shadowRoot.querySelector('[data-title]');
      if (t) t.textContent = this._cfg.title;
      var input = this.shadowRoot.querySelector('[data-search]');
      if (input) input.value = this._query;
      var focusEl = this.shadowRoot.querySelector('[data-focus]');
      var self = this;
      if (focusEl && typeof ResizeObserver !== 'undefined') {
        if (this._ro) this._ro.disconnect();

        this._ro.observe(focusEl);

    refresh() {
      if (this._loading) return;
      var self = this;
      this._loading = true;
      var badge = this.shadowRoot.querySelector('[data-badge]');
      if (badge) badge.textContent = '更新中…';

      grab(PROXY_API, 16000)
        .then(parsePayload)
        .catch(function () { return grab(OFFICIAL_API, 9000).then(parsePayload); })
        .then(function (payload) {
          var rows = sortRows((payload.results || []).map(normalize).filter(Boolean));
          if (!rows.length) throw new Error('官方回應沒有活動資料');
          var intro = payload.top && payload.top.introduction;
          self._data = rows;
          if (intro) self._intro = { t: plain(intro.title), d: plain(intro.description) };
          self._updatedAt = Date.now();
          self._offline = false;
          self._notice = '';

        .catch(function (err) {
          if (!self._data || !self._data.length) {

          }
          self._offline = true;
          self._notice = '目前顯示 ' + SNAPSHOT_DATE + ' 取得的活動快照' +
            '<button type="button" data-retry>重試</button>';
          self._paint();
          self.dispatchEvent(new CustomEvent('macau-tour:error', {
            bubbles: true, composed: true, detail: { message: err.message }

    _filtered() {
      var q = this._query.toLowerCase(), t = this._type, ended = t === '已結束';
      return this._data.filter(function (r) {

          if (r.status.cls !== 'done') return false;
        } else if (t !== '全部' && r.types.indexOf(t) < 0) {

      var badge = sr.querySelector('[data-badge]');

      var ft = sr.querySelector('[data-focus-title]');
      var fd = sr.querySelector('[data-focus-desc]');

        focus.hidden = false;
        if (ft) ft.textContent = this._intro.t;
        if (fd) fd.textContent = this._intro.d || '';

      if (chips) {
        /* 類別篩選之後，最右再加一個「已結束」狀態篩選 */
        var names = ['全部'].concat(TYPES).concat(['已結束']);
        chips.innerHTML = names.map(function (n) {
          var ended = n === '已結束';
          /* 已結束的活動已包含在「全部」與各類別中，故不重複顯示總數 */
          var c = ended ? 0

            : this._data.filter(function (r) { return r.types.indexOf(n) >= 0; }).length;
          return '<button class="chip' + (this._type === n ? ' on' : '') + (ended ? ' ended' : '') +

      }

      if (notice) {
        notice.hidden = !this._notice;
        notice.innerHTML = this._notice || '';

      this._paintList();

      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(function () { self._syncFocusMore(); });
      } else this._syncFocusMore();
    }

    /** 依實際排版判斷內文是否被 3 行截斷，決定「更多／收起」是否出現。

    _syncFocusMore() {
      var sr = this.shadowRoot;
      var focus = sr.querySelector('[data-focus]');
      var p = sr.querySelector('[data-focus-desc]');
      var ft = sr.querySelector('[data-focus-ft]');
      var btn = sr.querySelector('[data-focus-more]');
      if (!focus || !p || !ft || !btn) return;
      if (focus.hidden || !focus.getClientRects().length) { ft.hidden = true; return; }
      var open = focus.classList.contains('is-open');
      var need = open || p.scrollHeight > p.clientHeight + 1;
      ft.hidden = !need;
      btn.textContent = open ? '收起' : '更多';
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    _paintList() {
      var sr = this.shadowRoot;
      var rows = this._filtered();
      var shown = rows.slice(0, this._limit);
      var list = sr.querySelector('[data-list]');
      if (list) {
        list.innerHTML = shown.length ? shown.map(function (r) {
          var href = /^\d+$/.test(r.id) ? DETAIL_BASE + r.id : '';
          var tags = r.types.slice(0, 2).map(function (t) {
            return '<span class="cat ' + typeClass(t) + '">' + esc(t) + '</span>';
          }).join('');
          var body = '<div class="row"><span class="date">' + esc(r.date) + '</span>' +
            '<span class="st ' + r.status.cls + '">' + esc(r.status.text) + '</span></div>' +
            '<h4>' + esc(r.name) + '</h4>' +
            (r.locs.length ? '<p class="meta">' + esc(r.locs.join('、')) + '</p>' : '') +
            (r.desc ? '<p class="desc">' + esc(r.desc) + '</p>' : '') +
            '<div class="cats">' + tags + '</div>';
          var cls = 'item' + (r.status.cls === 'done' ? ' is-done' : '');
          return href
            ? '<a class="' + cls + '" href="' + href + '" target="_blank" rel="noopener noreferrer">' + body + '</a>'
            : '<div class="' + cls + '">' + body + '</div>';
        }).join('') : '<div class="empty">沒有符合條件的活動</div>';
      }
      var result = sr.querySelector('[data-result]');
      if (result) {
        result.textContent = '顯示 ' + shown.length + ' / ' + rows.length + ' 則' +
          (this._type !== '全部' ? ' · ' + this._type : '');
      }
      var more = sr.querySelector('[data-more]');
      if (more) {
        var left = rows.length - shown.length;
        more.hidden = left <= 0;
        more.textContent = left > 0 ? '載入更多（尚有 ' + left + ' 則）' : '';
      }
    }

    _onClick(e) {
      var t = e.target && e.target.closest
        ? e.target.closest('[data-chip], [data-more], [data-retry], [data-focus-more]') : null;
      if (!t) return;
      if (t.hasAttribute('data-focus-more')) {
        var focus = this.shadowRoot.querySelector('[data-focus]');
        if (focus) focus.classList.toggle('is-open');
        this._syncFocusMore();
        return;
      }
      if (t.hasAttribute('data-chip')) {
        this._type = t.getAttribute('data-chip');
        this._limit = this._cfg.limit;
        this._paint();
      } else if (t.hasAttribute('data-more')) {
        this._limit += PAGE_SIZE;
        this._paintList();
      } else if (t.hasAttribute('data-retry')) {
        this.refresh();
      }
    }

    _onInput(e) {
      if (!e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-search')) return;
      this._query = clean(e.target.value).toLowerCase();
      this._limit = this._cfg.limit;
      this._paintList();
    }
  }

  if (window.customElements) window.customElements.define('macau-tour-widget', MacauTourWidget);
})();

  function esc(s) {

    }
    /* 資料框：位置由搜索框下方開始 */
    .panel {
      position: relative; overflow: hidden; border-radius: 20px; padding: var(--pad);
      border: 1px solid var(--c-line);
      background:
        radial-gradient(460px 280px at 100% -12%, rgba(255, 207, 112, .14), transparent 72%),
        radial-gradient(420px 260px at 0% 108%, rgba(70, 200, 155, .14), transparent 74%),
        linear-gradient(135deg, rgba(11, 58, 48, .62), rgba(7, 38, 34, .46) 55%, rgba(12, 62, 52, .56));
      box-shadow: 0 20px 52px rgba(2, 20, 16, .34), inset 0 1px 0 rgba(190, 255, 228, .13);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
    }
    :host([data-theme="light"]) .panel {
      background:
        radial-gradient(420px 260px at 100% -12%, rgba(190, 140, 40, .14), transparent 72%),
        radial-gradient(420px 260px at 0% 108%, rgba(70, 190, 150, .16), transparent 74%),
        linear-gradient(135deg, rgba(220, 244, 234, .80), rgba(238, 250, 244, .66) 55%, rgba(214, 240, 230, .78));
      box-shadow: 0 18px 44px rgba(12, 70, 56, .12), inset 0 1px 0 rgba(255, 255, 255, .85);
    }
    .panel::before {
      content: ""; position: absolute; top: 0; left: 6%; right: 6%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 207, 112, .5), transparent); pointer-events: none;
    }
    .hd { position: relative; z-index: 1; padding: 0 var(--pad);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .hd h2 { margin: 0; font-size: clamp(18px, 2.4cqw, 22px); letter-spacing: .02em; display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .hd h2 .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--c-warn); box-shadow: 0 0 10px var(--c-warn); flex: none; }
    .badge { flex: none; border: 1px solid var(--c-line); border-radius: 999px; padding: 4px 11px;
      font-size: 12px; color: var(--c-warn); background: var(--c-tile); font-variant-numeric: tabular-nums; }
    .notice { position: relative; z-index: 1; margin-top: 12px; padding: 8px 12px; border-radius: 12px;
      font-size: 12.5px; color: var(--c-warn); background: rgba(255, 207, 112, .10); border: 1px solid rgba(255, 207, 112, .35); }
    .notice button { margin-left: 8px; border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px;
      background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .tools { position: relative; z-index: 1; margin-top: 16px; display: flex; justify-content: center; }
    /* 搜尋框：Google 首頁式圓角膠囊，底色比卡片淺一層，載入前即可辨識 */
    .search { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 560px;
      padding: 11px 20px; border-radius: 999px;
      background: var(--c-field); border: 1px solid var(--c-field-line);
      box-shadow: 0 2px 10px rgba(2, 20, 16, .10), inset 0 1px 0 rgba(255, 255, 255, .10);
      transition: background .18s, border-color .18s, box-shadow .18s; }
    .search:hover { background: var(--c-field-2); box-shadow: 0 4px 18px rgba(2, 20, 16, .18); }
    .search:focus-within { background: var(--c-field-2); border-color: var(--c-accent);
      box-shadow: 0 6px 24px rgba(2, 20, 16, .22); }
    .search svg { width: 18px; height: 18px; flex: none; color: var(--c-faint); }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--c-text); font: inherit; font-size: 15px; }
    .search input::placeholder { color: var(--c-faint); }
    .result { position: relative; z-index: 1; margin: 14px 0 8px; font-size: 12.5px; color: var(--c-muted); }
    .result:empty { display: none; }
    .list { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .place { display: flex; gap: 12px; min-width: 0; padding: 12px; border-radius: 14px;
      background: var(--c-tile); border: 1px solid var(--c-line); }
    .cat { flex: none; width: 62px; text-align: center; padding: 7px 3px; border-radius: 11px; background: var(--c-tile-2); }
    .cat b { display: block; font-size: 12.5px; white-space: nowrap; }
    /* 依來源上色：旅遊局＝紅、市政署＝藍；框內文字改白以確保對比 */
    .place[data-from="dst"] { background: rgb(191, 42, 42); border-color: rgba(255, 255, 255, .20); }
    .place[data-from="iam"] { background: rgb(33, 150, 243); border-color: rgba(255, 255, 255, .20); }
    .place[data-from] { color: #fff; }
    .place[data-from] .cat { background: rgba(0, 0, 0, .18); }
    .place[data-from] .cat b { color: #fff; }
    .place[data-from] .cat span { color: rgba(255, 255, 255, .78); }
    .place[data-from] .en { color: rgba(255, 255, 255, .82); }
    .place[data-from] .addr { color: rgba(255, 255, 255, .92); }
    .place[data-from] .addr svg { color: rgba(255, 255, 255, .72); }
    .place[data-from] .meta { color: rgba(255, 255, 255, .80); }
    .place[data-from] .meta a { color: #fff; text-decoration: underline; }
    .place[data-from] .addr-en { color: rgba(255, 255, 255, .70); }
    .place[data-from] .tag { color: #fff; border-color: rgba(255, 255, 255, .50); }
    .place[data-from] .links a { color: #fff; text-decoration: underline; }
    .cat span { display: block; margin-top: 2px; font-size: 9.5px; color: var(--c-faint); letter-spacing: .04em; }
    .body { min-width: 0; flex: 1; }
    .line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .line h3 { margin: 0; font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .tag { flex: none; font-size: 10.5px; color: var(--c-warn); border: 1px solid rgba(255, 207, 112, .4);
      border-radius: 999px; padding: 1px 7px; }
    .en { margin-top: 2px; font-size: 11.5px; color: var(--c-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr { margin-top: 5px; display: flex; align-items: flex-start; gap: 5px; font-size: 12px; color: var(--c-muted); }
    .addr svg { width: 13px; height: 13px; flex: none; margin-top: 2px; color: var(--c-faint); }
    .addr span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .meta { margin-top: 5px; font-size: 11px; color: var(--c-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta a { color: var(--c-accent-2); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .meta i { margin: 0 6px; font-style: normal; opacity: .6; }
    .foot { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .addr-en { min-width: 0; font-size: 10.5px; color: var(--c-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .links { flex: none; display: flex; gap: 9px; }
    .links a { font-size: 11.5px; color: var(--c-accent-2); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    /* 初始提示只是文字，不加外框，避免與搜尋框連成一體 */
    .hint { grid-column: 1 / -1; padding: 4px 4px 6px; text-align: center; color: var(--c-faint);
      font-size: 13px; border: 0; background: none; }
    .empty { grid-column: 1 / -1; padding: 26px 12px; text-align: center; color: var(--c-muted);
      font-size: 13.5px; border: 1px dashed var(--c-line); border-radius: 14px; }
    .more { position: relative; z-index: 1; display: block; margin: 14px auto 0; padding: 8px 18px;
      border: 1px solid var(--c-line); border-radius: 999px; background: var(--c-tile-2);
      color: var(--c-text); font: inherit; font-size: 13px; cursor: pointer; }
    .more:hover { border-color: var(--c-accent); color: var(--c-accent); }
    /* 搜尋框吸附：頁面捲動時只有下方資料移動；僅在吸附時鋪底，平時不顯示色塊 */
    .tools { position: sticky; top: var(--sticky-top, 124px); z-index: 3; padding: 12px var(--pad) 10px; }
    .tools.is-pinned {
      background: linear-gradient(180deg, rgba(9, 45, 38, .97) 0%, rgba(9, 45, 38, .97) 84%, rgba(9, 45, 38, 0) 100%); }
    :host([data-theme="light"]) .tools.is-pinned {
      background: linear-gradient(180deg, rgba(233, 249, 241, .97) 0%, rgba(233, 249, 241, .97) 84%, rgba(233, 249, 241, 0) 100%); }
    /* 框外元素沿用原本的水平內縮，維持相對位置 */
    .notice { margin-left: var(--pad); margin-right: var(--pad); }
    .result { margin-top: 0; }
    /* 作者樣式的 display:block 會蓋過 hidden 屬性，需收回來 */
    .more[hidden] { display: none !important; }
    /* 整組往右延伸到距卡片右邊線 8px，讓最長一行（市政署）貼近邊線 */
    .srcs { position: relative; z-index: 1; margin-top: 18px; padding-top: 12px;
      margin-right: calc(8px - clamp(16px, 2.2vw, 24px));
      border-top: 1px solid var(--c-line);
      display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; }
    /* 名稱與間數同一行，整組自右側 1/4 處起排 */
    .src-row { grid-column: 2; display: flex; align-items: baseline; gap: 10px;
      text-decoration: none; white-space: nowrap; }
    .src-name { font-size: 12.5px; color: var(--c-muted); border-bottom: 1px dotted currentColor; }
    .src-row:hover .src-name { color: var(--c-accent); }
    .src-meta { font-size: 12.5px; color: var(--c-faint); font-variant-numeric: tabular-nums; }
    .src-meta b { color: var(--c-muted); }
    /* 手機：置中且不換行 */
    @container (max-width: 560px) {
      .srcs { grid-template-columns: minmax(0, 1fr); margin-right: 0; }
      .src-row { grid-column: 1; justify-content: center; }
      .src-name, .src-meta { font-size: 11.5px; }
    }
    @container (max-width: 620px) { .list { grid-template-columns: minmax(0, 1fr); } }
    @container (max-width: 360px) {
      .cat { width: 54px; }
      .place { gap: 9px; padding: 10px; }
      .line h3 { font-size: 14px; }
    }
  `;

  class MacauRegistryWidget extends HTMLElement {
    static get observedAttributes() { return ['refresh', 'theme', 'title', 'limit']; }

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this._iam = [];
      this._dst = [];
      this._all = [];
      this._q = '';
      this._qRaw = '';
      this._limit = PAGE_SIZE;
      this._updatedAt = null;
      this._loaded = false;
      this._notice = '';
      this._loading = false;
      this._timer = null;
      this._shelled = false;
      this._tools = null;
      this._onWinScroll = null;
      var self = this;
      this.shadowRoot.addEventListener('click', function (e) { self._onClick(e); });
      this.shadowRoot.addEventListener('input', function (e) { self._onInput(e); });
    }

    get cfg() {
      var a = this.getAttribute.bind(this);
      return {
        title: a('title') || '旅遊局｜市政署牌照場所',
        theme: a('theme') || 'light',
        refresh: clampInt(a('refresh'), 30, 3600, 300),
        limit: clampInt(a('limit'), 4, 60, PAGE_SIZE)
      };
    }

    connectedCallback() {
      if (this._shelled) return;
      this._shelled = true;
      this._cfg = this.cfg;
      if (this.getAttribute('data-theme') !== this._cfg.theme) this.setAttribute('data-theme', this._cfg.theme);
      this._limit = this._cfg.limit;
      this._shell();
      this._paint();
      this._startTimer();
      this.refresh();
    }

    disconnectedCallback() {
      clearInterval(this._timer);
      if (this._onWinScroll) {
        window.removeEventListener('scroll', this._onWinScroll);
        window.removeEventListener('resize', this._onWinScroll);
        this._onWinScroll = null;
      }
    }

    attributeChangedCallback(name, oldVal, newVal) {
      if (oldVal === newVal || !this._shelled) return;
      this._cfg = this.cfg;
      if (name === 'theme') {
        if (this.getAttribute('data-theme') !== this._cfg.theme) this.setAttribute('data-theme', this._cfg.theme);
      } else if (name === 'refresh') {
        this._startTimer();
      } else if (name === 'title') {
        var t = this.shadowRoot.querySelector('[data-title]');
        if (t) t.textContent = this._cfg.title;
      } else if (name === 'limit') {
        this._limit = this._cfg.limit;
        this._paintList();
      }
    }

    _startTimer() {
      clearInterval(this._timer);
      /* no-auto：只在進入網頁時讀取一次，不啟動每 5 分鐘的自動重整。 */
      if (this.hasAttribute('no-auto')) return;
      var self = this;
      this._timer = setInterval(function () { self.refresh(); }, this._cfg.refresh * 1000);
    }

    _shell() {
      this.shadowRoot.innerHTML = '<style>' + STYLE + '</style>' +
        '<div class="card">' +
          '<div class="hd"><div><h2><i class="pip"></i><span data-title></span></h2></div>' +
          '<span class="badge" data-badge>載入中…</span></div>' +
          '<div class="notice" data-notice hidden></div>' +
          '<div class="tools"><label class="search">' + searchIcon() +
            '<input type="search" data-search placeholder="搜尋場所名稱／地址／電話／類別" aria-label="搜尋旅遊局及市政署牌照場所">' +
            '</label></div>' +
          '<div class="panel">' +
            '<div class="result" data-result></div>' +
            '<div class="list" data-list></div>' +
            '<button class="more" type="button" data-more hidden></button>' +
            '<div class="srcs" data-sources></div>' +
          '</div>' +
        '</div>';
      this._tools = this.shadowRoot.querySelector('.tools');
      if (this._tools && !this._onWinScroll) {
        var self = this;
        this._onWinScroll = function () { self._updatePin(); };
        window.addEventListener('scroll', this._onWinScroll, { passive: true });
        window.addEventListener('resize', this._onWinScroll);
      }
      var t = this.shadowRoot.querySelector('[data-title]');
      if (t) t.textContent = this._cfg.title;
      var input = this.shadowRoot.querySelector('[data-search]');
      if (input) input.value = this._qRaw;
    }

    refresh() {
      if (this._loading) return;
      var self = this;
      this._loading = true;

      var iamTask = fetch(DINING_API, {
        headers: { 'Authorization': 'APPCODE ' + APPCODE, 'Accept': 'application/json' }
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (j) {
        var arr = Array.isArray(j) ? j : (j && Array.isArray(j.data) ? j.data : []);
        var rows = arr.map(normalizeIam).filter(Boolean);
        if (!rows.length) throw new Error('沒有資料');
        return rows;
      }).then(function (rows) { return { ok: true, rows: rows }; },
              function (err) { return { ok: false, err: err.message }; });

      var dstTask = Promise.all(DST_SOURCES.map(function (s) {
        return fetch(s.api, {
          headers: { 'Authorization': 'APPCODE ' + APPCODE, 'Accept': 'application/xml' }
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        }).then(function (text) { return parseDstXml(text, s.cat); })
          .then(function (rows) { return { id: s.cat, ok: true, rows: rows }; },
                function (err) { return { id: s.cat, ok: false, err: err.message }; });
      })).then(function (res) {
        var merged = [], failed = [], anyOk = false;
        res.forEach(function (r) {
          if (r.ok) { anyOk = true; merged = merged.concat(r.rows); }
          else failed.push(r.id + '（' + r.err + '）');
        });
        return { ok: anyOk, rows: merged, failed: failed };
      });

      Promise.all([iamTask, dstTask]).then(function (res) {
        var iamRes = res[0], dstRes = res[1];
        if (iamRes.ok) self._iam = iamRes.rows;
        if (dstRes.ok) self._dst = dstRes.rows;
        self._all = self._iam.concat(self._dst);
        self._all.forEach(function (r, i) { r._k = i; });
        self._loaded = true;

        var fails = [];
        if (!iamRes.ok) fails.push('市政署（' + iamRes.err + '）');
        if (dstRes.failed.length) fails.push('旅遊局 ' + dstRes.failed.join('、'));

        if (fails.length && !self._all.length) {
          self._notice = '無法連接官方資料來源（' + esc(fails.join('；')) + '）。' +
            '<button type="button" data-retry>重試</button>';
        } else if (fails.length) {
          self._notice = '部分來源暫時無法連接（' + esc(fails.join('；')) + '），顯示上次成功取得的資料。' +
            '<button type="button" data-retry>重試</button>';
        } else {
          self._notice = '';
        }

        if (iamRes.ok || dstRes.ok) self._updatedAt = Date.now();
        self._paint();

        self.dispatchEvent(new CustomEvent('macau-registry:update', {
          bubbles: true, composed: true,
          detail: {
            count: self._all.length,
            iam: self._iam.length,
            dst: self._dst.length,
            updatedAt: self._updatedAt
          }
        }));
        if (fails.length) {
          self.dispatchEvent(new CustomEvent('macau-registry:error', {
            bubbles: true, composed: true, detail: { message: fails.join('；') }
          }));
        }
      }).catch(function (err) {
        self._notice = '讀取資料時發生錯誤（' + esc(err.message) + '）。' +
          '<button type="button" data-retry>重試</button>';
        self._paint();
        self.dispatchEvent(new CustomEvent('macau-registry:error', {
          bubbles: true, composed: true, detail: { message: err.message }
        }));
      }).then(function () {
        self._loading = false;
      });
    }

    _filtered() {
      var q = this._q;
      if (!q) return [];
      function score(r) {
        var names = [r.zh, r.en, r.pt];
        if (names.some(function (v) { return String(v || '').toLowerCase() === q; })) return 0;
        if (names.some(function (v) { return String(v || '').toLowerCase().indexOf(q) === 0; })) return 1;
        if (names.some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return 2;
        return 3;
      }
      return this._all.filter(function (r) {
        return [r.cat, r.zh, r.en, r.pt, r.addr, r.addrAlt, r.area, r.tel, r.site,
          r.cuisine, r.hours, r.email].some(function (v) {
          return String(v || '').toLowerCase().indexOf(q) >= 0;
        });
      }).sort(function (a, b) {
        return (score(a) - score(b)) || ((a._k || 0) - (b._k || 0));
      });
    }

    _paint() {
      var total = this._all.length;
      var badge = this.shadowRoot.querySelector('[data-badge]');
      if (badge) badge.textContent = this._loaded ? num(total) + ' 間場所' : '載入中…';
      var notice = this.shadowRoot.querySelector('[data-notice]');
      if (notice) { notice.innerHTML = this._notice || ''; notice.hidden = !this._notice; }
      this._paintList();
      this._paintSources();
      this._updatePin();
    }

    _paintList() {
      var list = this.shadowRoot.querySelector('[data-list]');
      var result = this.shadowRoot.querySelector('[data-result]');
      var more = this.shadowRoot.querySelector('[data-more]');
      if (!this._q) {
        if (list) list.innerHTML = '<div class="hint">輸入場所名稱、地址、電話或類別，開始搜尋…</div>';
        if (result) result.textContent = '';
        if (more) more.hidden = true;
        return;
      }
      var rows = this._filtered();
      var shown = Math.min(this._limit, rows.length);
      if (list) {
        list.innerHTML = rows.length
          ? rows.slice(0, shown).map(itemHtml).join('')
          : '<div class="empty">找不到符合「' + esc(this._qRaw) + '」的場所，試試其他關鍵字。</div>';
      }
      if (result) {
        result.textContent = rows.length
          ? '符合「' + this._qRaw + '」的場所共 ' + num(rows.length) + ' 間 · 顯示 ' + num(shown)
          : '沒有符合條件的場所';
      }
      if (more) {
        more.hidden = shown >= rows.length;
        more.textContent = '顯示更多（尚有 ' + num(rows.length - shown) + ' 間）';
      }
    }

    /* 搜尋框吸附到頁首／分類列下方時才鋪底，未吸附時保持透明 */
    _updatePin() {
      var t = this._tools;
      if (!t) return;
      var top = parseFloat(getComputedStyle(t).top) || 0;
      var r = t.getBoundingClientRect();
      t.classList.toggle('is-pinned', r.top <= top + 1 && r.bottom > 0);
    }

    /* 連結名稱與間數同一行，整組自右側 1/4 處起排 */
    _paintSources() {
      var box = this.shadowRoot.querySelector('[data-sources]');
      if (!box) return;
      var self = this;
      box.innerHTML = LINKS.map(function (l) {
        var n = l.key === 'iam' ? self._iam.length : self._dst.length;
        var cnt = self._loaded ? '共 <b>' + num(n) + '</b> 間' : '載入中…';
        return '<a class="src-row" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer"' +
          ' title="' + esc(l.href) + '">' +
          '<span class="src-name">' + esc(l.name) + ' ↗</span>' +
          '<span class="src-meta">' + cnt + '</span></a>';
      }).join('');
    }

    _onClick(e) {
      var t = e.target && e.target.closest ? e.target.closest('[data-more],[data-retry]') : null;
      if (!t) return;
      if (t.hasAttribute('data-more')) {
        this._limit += this._cfg.limit;
        this._paintList();
      } else if (t.hasAttribute('data-retry')) {
        this.refresh();
      }
    }

    _onInput(e) {
      if (!e.target || !e.target.matches || !e.target.matches('[data-search]')) return;
      this._qRaw = clean(e.target.value);
      this._q = this._qRaw.toLowerCase();
      this._limit = this._cfg.limit;
      this._paintList();
    }

      var panel = this.closest ? this.closest('[data-view-panel]') : null;
      if (panel && panel.hasAttribute('hidden')) return false;
      return this.offsetParent !== null ||
        (this.getClientRects && this.getClientRects().length > 0);
    }

    _watch() {
      var self = this;
      function activate() {
        if (self._activated) return;
        self._activated = true;
        self._justActivated = true;
        if (self._io) { self._io.disconnect(); self._io = null; }
        self.refresh();
      }
      if (this._isVisible()) {
        activate();
        self._justActivated = false;
      } else if (window.IntersectionObserver) {
        this._io = new IntersectionObserver(function (entries) {
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) { activate(); break; }
          }
        }, { threshold: 0.01 });
        this._io.observe(this);
      }
      /* 每次進入「巴士站」分頁都重新核對官方版本；其餘分頁完全不連線 */
      this._onTabClick = function (e) {
        var t = e.target && e.target.closest
          ? e.target.closest('.view-tab[data-view="bus"]') : null;
        if (!t) return;
        setTimeout(function () {
          if (!self._activated) activate();
          else if (!self._justActivated) self.refresh();
          self._justActivated = false;
        }, 0);
      };
      document.addEventListener('click', this._onTabClick);
    }

    _emitUpdate(detail) {
      this.dispatchEvent(new CustomEvent('macau-bus:update', {
        bubbles: true, composed: true, detail: detail
      }));
    }
    _emitError(message) {
      this.dispatchEvent(new CustomEvent('macau-bus:error', {
        bubbles: true, composed: true, detail: { message: message }
      }));
    }

    /* 只在巴士站分頁顯示時連線；重整先只抓約 0.6KB 官方目錄比對版本 */
    refresh(force) {
      var self = this;
      if (!this._isVisible()) {
        this._paint();
        this._emitUpdate({ idle: true, count: STOPS.length, sites: SITES });
        return;
      }
      this._activated = true;
      if (this._loading) {
        this._emitUpdate({ pending: true, count: STOPS.length, sites: SITES });
        return;
      }
      this._loading = true;
      this._state = 'loading';
      this._paint();
      loadOfficial(!!force).then(function (d) {
        self._loading = false;
        DATA = d;
        applyData(d.stops);
        self._state = d.stale ? 'stale' : 'ready';
        self._err = d.reason || '';
        self._paint();
        self._emitUpdate({
          count: STOPS.length, sites: SITES, version: d.version,
          fromCache: d.fromCache, snapshot: false
        });
        if (d.stale) self._emitError(d.reason || '官方檔案暫時無法取得');
      }).catch(function (err) {
        self._loading = false;
        self._state = 'error';
        self._err = err && err.message ? err.message : String(err);
        self._paint();
        self._emitError(self._err);
      });
    }

    _shell() {
      this.shadowRoot.innerHTML = '<style>' + STYLE + '</style>' +
        '<div class="card">' +
          '<div class="hd"><h2><i class="pip"></i><span data-title></span></h2>' +
          '<span class="badge" data-badge></span></div>' +
          '<div class="tools"><div class="toolwrap"><label class="search">' + searchIcon() +
            '<input type="search" data-search placeholder="搜尋站名／站號／站牌編號／路線（例：M11、亞馬喇前地、3A）" aria-label="搜尋澳門巴士站">' +
            '<button class="clr" type="button" data-clear hidden aria-label="清除搜尋">×</button>' +
            '</label>' +
            '<div class="mode" data-mode>' +
              '<button class="mb on" type="button" data-set-mode="site">依站點</button>' +
              '<button class="mb" type="button" data-set-mode="pole">逐站牌</button>' +
            '</div></div></div>' +
          '<div class="panel">' +
            '<div class="result" data-result></div>' +
            '<div class="list" data-list></div>' +
            '<div class="actions">' +
              '<button class="more" type="button" data-more hidden></button>' +
              '<button class="more" type="button" data-all hidden></button>' +
            '</div>' +
            '<div class="srcs" data-sources></div>' +
          '</div>' +
        '</div>';

      var self = this;
      this.shadowRoot.addEventListener('click', function (e) { self._onClick(e); });
      this.shadowRoot.addEventListener('input', function (e) { self._onInput(e); });
      this._tools = this.shadowRoot.querySelector('.tools');
      if (this._tools && !this._onWinScroll) {
        this._onWinScroll = function () { self._updatePin(); };
        window.addEventListener('scroll', this._onWinScroll, { passive: true });
        window.addEventListener('resize', this._onWinScroll);
      }
      var t = this.shadowRoot.querySelector('[data-title]');
      if (t) t.textContent = this._cfg.title;
      this._paintLinks();
    }

    _items() { return this._mode === 'pole' ? STOPS : GROUPS; }

    _filtered() {
      var q = this._q, all = this._items();
      if (!q) return all;
      var hit = [];
      for (var i = 0; i < all.length; i++) {
        var sc = score(all[i], q);
        if (sc >= 0) hit.push({ s: all[i], sc: sc, k: i });
      }
      hit.sort(function (a, b) { return (a.sc - b.sc) || (a.k - b.k); });
      return hit.map(function (x) { return x.s; });
    }

    _paint() {
      this._paintModeCounts();
      var badge = this.shadowRoot.querySelector('[data-badge]');
      var ready = (this._state === 'ready' || this._state === 'stale') && STOPS.length;

      if (badge) badge.textContent = ready
        ? num(STOPS.length) + ' 個站牌 · ' + num(SITES) + ' 個站點'
        : '官方即時資料';

      if (!ready) { this._paintState(); return; }
      this._paintList();
      this._updatePin();
    }

    _paintState() {
      var list = this.shadowRoot.querySelector('[data-list]');
      var result = this.shadowRoot.querySelector('[data-result]');
      var more = this.shadowRoot.querySelector('[data-more]');
      var all = this.shadowRoot.querySelector('[data-all]');
      var clr = this.shadowRoot.querySelector('[data-clear]');
      var msg = {
        idle: '切到「巴士站」分類時才會向官方取得資料；其餘頁面完全不連線。',
        loading: '正在向澳門政府數據開放平台核對官方資料版本…',
        error: '無法取得官方資料：' + this._err
      }[this._state] || '';
      if (result) result.textContent = msg;
      if (list) {
        list.innerHTML = '<div class="empty">' + (this._state === 'error'
          ? '官方資料暫時無法載入。請重新載入本頁再試，或使用下方交通事務局的官方連結查詢。'
          : this._state === 'loading'
            ? '正在取得官方資料…首次載入需下載一次官方檔案，之後會由快取讀取。'
            : '尚未載入官方資料。') + '</div>';
      }
      if (more) more.hidden = true;
      if (all) all.hidden = true;
      if (clr) clr.hidden = true;
    }

    _paintModeCounts() {
      var box = this.shadowRoot.querySelector('[data-mode]');
      if (!box) return;
      var has = (this._state === 'ready' || this._state === 'stale') && STOPS.length;
      var site = box.querySelector('[data-set-mode="site"]');
      var pole = box.querySelector('[data-set-mode="pole"]');
      if (site) site.textContent = '依站點' + (has ? ' ' + num(SITES) : '');
      if (pole) pole.textContent = '逐站牌' + (has ? ' ' + num(STOPS.length) : '');
    }

    _paintList() {
      var list = this.shadowRoot.querySelector('[data-list]');
      var result = this.shadowRoot.querySelector('[data-result]');
      var more = this.shadowRoot.querySelector('[data-more]');
      var all = this.shadowRoot.querySelector('[data-all]');
      var clr = this.shadowRoot.querySelector('[data-clear]');
      var rows = this._filtered();
      var total = rows.length;
      var shown = this._showAll ? total : Math.min(this._limit, total);
      var unit = this._mode === 'pole' ? '個站牌' : '個站點';
      var overview = this._mode === 'pole'
        ? '全澳共 ' + num(STOPS.length) + ' 個站牌（' + num(SITES) + ' 個站點）· 顯示 ' + num(shown)
        : '全澳共 ' + num(SITES) + ' 個站點（' + num(STOPS.length) + ' 個站牌）· 顯示 ' + num(shown);

      if (clr) clr.hidden = !this._qRaw;
      if (list) {
        var render = this._mode === 'pole' ? poleHtml : siteHtml;
        list.innerHTML = total
          ? rows.slice(0, shown).map(render).join('')
          : '<div class="empty">找不到符合「' + esc(this._qRaw) + '」的巴士站，試試站名、站號（如 M11）或路線（如 3A）。</div>';
      }
      if (result) {
        result.textContent = total
          ? (this._qRaw ? '符合「' + this._qRaw + '」共 ' + num(total) + ' ' + unit + ' · 顯示 ' + num(shown)
                       : overview)
          : '沒有符合條件的巴士站';
      }
      if (more) {
        more.hidden = this._showAll || shown >= total;
        more.textContent = '顯示更多（尚有 ' + num(total - shown) + ' 個）';
      }
      if (all) {
        all.hidden = this._showAll || shown >= total;
        all.textContent = '一次顯示全部 ' + num(total) + ' 個';
      }
    }

    _paintLinks() {
      var box = this.shadowRoot.querySelector('[data-sources]');
      if (!box) return;
      box.innerHTML = '<h3>相關連結｜官方巴士資訊</h3><div class="src-grid">' +
        LINKS.map(function (l) {
          return '<a class="src-row" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer"' +
            ' title="' + esc(l.href) + '">' +
            '<span class="src-name">' + esc(l.name) + ' ↗</span>' +
            '<span class="src-desc">' + esc(l.desc) + '</span></a>';
        }).join('') + '</div>' +
        '<div class="credit">資料提供：' + esc(DATA.department || '交通事務局') +
        '　·　本頁不內建站點資料</div>';
    }

    _setQuery(raw) {
      this._qRaw = clean(raw);
      this._q = this._qRaw.toLowerCase();
      this._limit = this._cfg.limit;
      this._showAll = false;
      var input = this.shadowRoot.querySelector('[data-search]');
      if (input) input.value = this._qRaw;
      this._paintList();
    }

    _setMode(mode) {
      this._mode = mode === 'pole' ? 'pole' : 'site';
      this._limit = this._cfg.limit;
      this._showAll = false;
      var self = this;
      var box = this.shadowRoot.querySelector('[data-mode]');
      if (box) Array.prototype.forEach.call(box.querySelectorAll('[data-set-mode]'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-set-mode') === self._mode);
      });
      this._paintList();
    }

    _onClick(e) {
      var t = e.target && e.target.closest
        ? e.target.closest('[data-more],[data-all],[data-route],[data-query],[data-clear],[data-set-mode]')
        : null;
      if (!t) return;
      if (t.hasAttribute('data-set-mode')) {
        this._setMode(t.getAttribute('data-set-mode'));
      } else if (t.hasAttribute('data-more')) {
        this._limit += this._cfg.limit;
        this._paintList();
      } else if (t.hasAttribute('data-all')) {
        this._showAll = true;
        this._paintList();
      } else if (t.hasAttribute('data-route')) {
        this._setQuery(t.getAttribute('data-route'));
      } else if (t.hasAttribute('data-query')) {
        this._setQuery(t.getAttribute('data-query'));
      } else if (t.hasAttribute('data-clear')) {
        this._setQuery('');
      }
    }

    _onInput(e) {
      if (!e.target || !e.target.matches || !e.target.matches('[data-search]')) return;
      this._qRaw = clean(e.target.value);
      this._q = this._qRaw.toLowerCase();
      this._limit = this._cfg.limit;
      this._showAll = false;
      this._paintList();
    }

    _updatePin() {
      var t = this._tools;
      if (!t) return;
      var top = parseFloat(getComputedStyle(t).top) || 0;
      var r = t.getBoundingClientRect();
      t.classList.toggle('is-pinned', r.top <= top + 1 && r.bottom > 0);
    }
  }

  window.customElements.define('macau-busstops-widget', MacauBusstopsWidget);
})();
</script>


<script>
(function () {
  'use strict';

  var root = document.documentElement;
  var widgets = document.querySelectorAll('macau-tour-widget, macau-registry-widget, macau-busstops-widget');
  /* 主題不記憶：每次載入一律淺色，深色僅能由按鈕手動切換。 */


  /* ---------- 全站唯一的重新整理按鈕 ----------
     一次觸發所有元件同時重整（手動）。兩個分類在 HTML 上標記 no-auto，
     只在進入網頁時讀取一次，不會自動定時更新。 */
  var refreshBtn = document.getElementById('global-refresh');
  var refreshLabel = refreshBtn.querySelector('[data-refresh-label]');
  var SETTLE_EVENTS = [
    'macau-tour:update', 'macau-tour:error',
    'macau-registry:update', 'macau-registry:error',
    'macau-bus:update', 'macau-bus:error'
  ];
  var refreshing = false;

  function refreshAll() {
    if (refreshing) return;
    refreshing = true;
    var started = Date.now();
    refreshBtn.disabled = true;
    refreshBtn.classList.add('is-busy');
    refreshBtn.setAttribute('aria-busy', 'true');
    refreshLabel.textContent = '更新中…';

    var pending = widgets.length, seen = {}, finished = false, guard = null;

    function onSettle(e) {
      var key = e.type.replace(/:(update|error)$/, '');
      if (seen[key]) return;
      seen[key] = true;
      if (--pending <= 0) finish();
    }

    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      SETTLE_EVENTS.forEach(function (n) { document.removeEventListener(n, onSettle); });
      /* 至少轉動 0.7 秒，讓使用者看得到更新回饋 */
      var wait = Math.max(0, 700 - (Date.now() - started));
      setTimeout(function () {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('is-busy');
        refreshBtn.removeAttribute('aria-busy');
        refreshLabel.textContent = '重新整理';
        try {
          var f = new Intl.DateTimeFormat('zh-Hant', {
            timeZone: 'Asia/Macau', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          });
          refreshBtn.title = '上次更新：' + f.format(new Date()) + '（澳門時間）· 重新整理全部資訊';
        } catch (e) {
          refreshBtn.title = '重新整理全部資訊';
        }
        refreshing = false;
      }, wait);
    }

    SETTLE_EVENTS.forEach(function (n) { document.addEventListener(n, onSettle); });
    /* 若某元件正在載入而提前返回（不發事件），最多 5 秒後仍解除鎖定 */
    guard = setTimeout(finish, 5000);

    Array.prototype.forEach.call(widgets, function (w) {
      if (typeof w.refresh === 'function') w.refresh();
    });
  }

  refreshBtn.addEventListener('click', refreshAll);

  /* ---------- 主題 ---------- */
  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#eef3fa' : '#080e19');
    Array.prototype.forEach.call(widgets, function (w) { w.setAttribute('theme', theme); });
    var t = document.getElementById('theme-toggle');
    if (t) t.setAttribute('aria-label', theme === 'light' ? '切換為深色模式' : '切換為淺色模式');
  }

  /* 預設主題跟隨系統的深色／淺色偏好（prefers-color-scheme）；
     使用者按下主題按鈕後，本次瀏覽以手動選擇為準，系統偏好再變也不覆寫。 */
  var themeLocked = false;
  function systemTheme() {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'dark' : 'light';
  }
  applyTheme(systemTheme());
  if (window.matchMedia) {
    var mqTheme = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemTheme = function () { if (!themeLocked) applyTheme(mqTheme.matches ? 'dark' : 'light'); };
    if (mqTheme.addEventListener) mqTheme.addEventListener('change', onSystemTheme);
    else if (mqTheme.addListener) mqTheme.addListener(onSystemTheme);
  }

  document.getElementById('theme-toggle').addEventListener('click', function () {
    themeLocked = true;
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
  });

  /* ---------- 分類切換（預設只顯示「牌照場所」） ----------
     另一分類的資料必須按下對應按鈕才會出現。 */
  var VIEWS = ['bus', 'registry', 'tour'];
  var viewButtons = document.querySelectorAll('.view-tab');
  var viewPanels = document.querySelectorAll('[data-view-panel]');

  function setView(name) {
    if (VIEWS.indexOf(name) < 0) name = 'registry';
    Array.prototype.forEach.call(viewButtons, function (b) {
      var on = b.getAttribute('data-view') === name;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(viewPanels, function (p) {
      p.hidden = p.getAttribute('data-view-panel') !== name;
    });
    /* 手機按鈕列可橫向捲動時，讓目前分類的按鈕保持在可視範圍 */
    var tabs = document.querySelector('.view-tabs');
    var active = document.querySelector('.view-tab.is-active');
    if (tabs && active && tabs.scrollWidth > tabs.clientWidth && active.scrollIntoView) {
      active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }
  }

  Array.prototype.forEach.call(viewButtons, function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
  });

  var initialView = 'registry';
  var viewHash = (location.hash || '').replace(/^#/, '');
  if (VIEWS.indexOf(viewHash) >= 0) {
    initialView = viewHash;
  } else {
    var hashTarget = viewHash && document.getElementById(viewHash);
    var owner = hashTarget && hashTarget.closest ? hashTarget.closest('[data-view-panel]') : null;
    if (owner) initialView = owner.getAttribute('data-view-panel');
  }
  setView(initialView);

  /* ---------- 澳門時鐘 ---------- */
  var clockEl = document.getElementById('header-clock');
  var fmt = null;
  try {
    fmt = new Intl.DateTimeFormat('zh-Hant', {
      timeZone: 'Asia/Macau', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  } catch (e) {}

  function tick() {
    var now = new Date();
    if (fmt) {
      clockEl.textContent = fmt.format(now);
    } else {
      var d = new Date(now.getTime() + 8 * 3600 * 1000);
      function p(n) { return String(n).padStart(2, '0'); }
      clockEl.textContent = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
    }
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- 小工具狀態（無障礙提示） ---------- */
  ['macau-tour:error', 'macau-registry:error'].forEach(function (name) {
    document.addEventListener(name, function (e) {
      if (window.console) console.warn('[' + name + '] 資料更新失敗：', e.detail && e.detail.message);
    });
  });

  /* ---------- 展開資料時維持捲動位置 ----------
     各清單按「顯示更多／顯示全部／更多」時會重建列表 DOM，部分瀏覽器
     （尤其手機）會在內容高度變動後把捲動位置重算回頁首。此處於捕獲
     階段記下點按當下的位置，待元件重繪完成後分三個時間點還原，讓新
     資料在使用者原本停留的位置往下展開，而不是跳回上方。 */
  (function () {
    var EXPAND = '[data-more],[data-focus-more]';
    var userMoved = false;

    /* 還原期間若使用者自己捲動，就放棄鎖定，不與使用者搶捲動控制權 */
    ['wheel', 'touchmove', 'keydown'].forEach(function (n) {
      window.addEventListener(n, function () { userMoved = true; }, { passive: true });
    });

    function isExpand(node) {
      return !!(node && node.nodeType === 1 && node.matches && node.matches(EXPAND));
    }
    function findExpand(e) {
      var path = e.composedPath ? e.composedPath() : [];
      for (var i = 0; i < path.length; i++) {
        if (isExpand(path[i])) return path[i];
      }
      return isExpand(e.target) ? e.target : null;
    }
    function restore(y) {
      if (userMoved) return;
      /* 已在同一位置就不干預，避免影響使用者當下的捲動操作 */
      if (Math.abs(window.pageYOffset - y) < 1) return;
      window.scrollTo(0, y);
    }

    document.addEventListener('click', function (e) {
      if (!findExpand(e)) return;
      userMoved = false;
      var y = window.pageYOffset;
      /* 捕獲階段只登記；元件自己的重繪會在冒泡階段接續執行 */
      requestAnimationFrame(function () {
        restore(y);
        requestAnimationFrame(function () { restore(y); });
      });
      setTimeout(function () { restore(y); }, 80);
    }, true);
  })();
})();
</script>
<script>
/* ---------- 卡片內搜尋框的吸附位置 ----------
   頁首與分類列都是 sticky，分類列會隨視窗寬度換行而改變高度，
   因此量測兩者實際高度後寫入 --sticky-top，供各元件 .tools 使用。 */
(function () {
  var root = document.documentElement;
  var header = document.querySelector('.site-header');
  var tabs = document.querySelector('.view-tabs');
  if (!root || !tabs) return;

  function sync() {
    var h = (header ? header.getBoundingClientRect().height : 0) +
            tabs.getBoundingClientRect().height;
    root.style.setProperty('--sticky-top', Math.round(h) + 'px');
  }

  sync();
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(sync);
    if (header) ro.observe(header);
    ro.observe(tabs);
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', sync);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
})();
</script>
