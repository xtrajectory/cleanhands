<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script>
  /* 手機版固定為裝置寬度並禁止放大：iOS Safari 10+ 會忽略 user-scalable=no，
     故另外攔截其專有的雙指手勢；touch-action 則由下方 CSS 停用雙擊縮放。 */
  (function () {
    function block(e) { e.preventDefault(); }
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
      document.addEventListener(n, block, { passive: false });
    });
  })();
</script>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080e19">
<title>food-travel_hub</title>
<meta name="description" content="旅遊局旅遊快訊活動資訊、市政署餐飲場所名單與旅遊局五類牌照場所資訊。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1c30'/%3E%3Ctext x='32' y='44' font-size='34' font-family='serif' fill='%234fd1bd' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --header-h: 62px;
    --bg: #080e19;
    --bg-glow: rgba(79, 209, 189, .13);
    --surface: #101a2b;
    --surface-2: #16223a;
    --surface-3: #1b2942;
    --border: #22304a;
    --border-soft: #1a2740;
    --text: #e9f0fb;
    --muted: #93a7c4;
    --faint: #6b819f;
    --accent: #4fd1bd;
    --accent-2: #f4bd6a;
    --food-accent: #f08080;
    --shadow: 0 24px 60px rgba(2, 8, 18, .55);
    --radius: 18px;
  }
  html[data-theme="light"] {
    --bg: #eef3fa;
    --bg-glow: rgba(15, 140, 114, .10);
    --surface: #ffffff;
    --surface-2: #f4f8fd;
    --surface-3: #e9f0f9;
    --border: #dbe5f1;
    --border-soft: #e6eef8;
    --text: #101d33;
    --muted: #52678a;
    --faint: #7c90ad;
    --accent: #0f8c72;
    --accent-2: #a56809;
    --food-accent: #b8443c;
    --shadow: 0 20px 48px rgba(21, 43, 74, .10);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  /* 版面寬度鎖定為裝置寬度；停用自動字級調整、雙指與雙擊放大 */
  html {
    width: 100%; max-width: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    touch-action: pan-x pan-y;
  }

  body {
    margin: 0;
    width: 100%; max-width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
                 "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color .25s ease, color .25s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 480px at 50% -12%, var(--bg-glow), transparent 70%),
      radial-gradient(700px 400px at 92% 8%, rgba(244, 189, 106, .07), transparent 72%);
  }

  .shell {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 32px);
    position: relative;
    z-index: 1;
  }

  a { color: inherit; }

  .skip {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--accent);
    color: #04121a;
    padding: 10px 16px;
    border-radius: 0 0 10px 0;
    font-weight: 700;
    text-decoration: none;
    z-index: 100;
  }
  .skip:focus { left: 0; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------------- 頁首 ---------------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 62px;
    padding-block: 9px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .brand-text strong { font-size: 17.5px; letter-spacing: .04em; white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .macau-clock {
    display: flex; align-items: baseline; gap: 7px;
    font-variant-numeric: tabular-nums;
    font-size: 17px; font-weight: 700; letter-spacing: .05em;
    color: var(--text);
  }
  .macau-clock small { font-size: 12px; font-weight: 500; color: var(--faint); letter-spacing: .06em; }

  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: color .18s, border-color .18s, transform .18s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { width: 17px; height: 17px; }
  html[data-theme="dark"] .icon-sun { display: block; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="light"] .icon-sun { display: none; }
  html[data-theme="light"] .icon-moon { display: block; }

  /* ---------------- 分類切換按鈕（捲動時固定在頁首下方） ---------------- */
  .view-tabs {
    position: sticky;
    top: var(--header-h);
    z-index: 25;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
    margin-top: clamp(14px, 2vw, 20px);
    margin-bottom: clamp(16px, 2vw, 22px);
    padding-block: 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border-bottom: 1px solid var(--border-soft);
    border-radius: 0 0 14px 14px;
  }
  .view-tab {
    flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    color: var(--muted);
    font: inherit;
    font-size: 14.5px; font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s, border-color .18s, background-color .18s, transform .18s;
  }
  .view-tab:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .view-tab:active { transform: translateY(1px); }
  .view-tab.is-active {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
  }
  html[data-theme="light"] .view-tab.is-active {
    color: #0a6b56;
    border-color: rgba(15, 118, 92, .42);
    background: rgba(15, 140, 114, .10);
  }
  .view-tab .tab-ico { width: 18px; height: 18px; border-radius: 4px; object-fit: contain; flex: none; }
  .view-tab .tab-ico + .tab-ico { margin-left: -4px; }
  /* 牌照場所的兩枚標誌（旅遊局 MGTO、市政署 IAM）一律以原圖顏色顯示，不隨主題反相 */

  /* 全站唯一的重新整理按鈕（頁首「澳門時間」右方，僅顯示圖示） */
  .refresh-btn {
    flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    padding: 0;
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border));
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--accent);
    cursor: pointer;
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
    transition: border-color .18s, background-color .18s, transform .18s, opacity .18s;
  }
  .refresh-btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
  .refresh-btn:active { transform: translateY(1px); }
  .refresh-btn:disabled { opacity: .62; cursor: default; transform: none; }
  .refresh-btn svg { width: 17px; height: 17px; flex: none; }
  .refresh-btn.is-busy svg { animation: wb-spin .9s linear infinite; }
  .refresh-btn [data-refresh-label] { display: none; }
  @keyframes wb-spin { to { transform: rotate(360deg); } }
  /* 淺色底提高文字對比，維持至少 WCAG AA */
  html[data-theme="light"] .refresh-btn {
    color: #0a6b56;
    border-color: rgba(15, 118, 92, .42);
    background: rgba(15, 140, 114, .10);
  }
  html[data-theme="light"] .refresh-btn:hover {
    border-color: #0f8c72;
    background: rgba(15, 140, 114, .18);
  }

  /* ---------------- 天氣預報 1/2 + 合併天氣資訊 1/2 ---------------- */
  .top-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(14px, 1.8vw, 20px);
    align-items: start;
    margin-bottom: clamp(18px, 2.4vw, 26px);
  }
  .top-row > * { min-width: 0; }
  @media (max-width: 900px) {
    .top-row { grid-template-columns: minmax(0, 1fr); }
  }
  .tour-panel, .dining-panel, .license-panel, .registry-panel { margin-bottom: clamp(18px, 2.4vw, 26px); }

  /* ---------------- 墨綠玻璃框 ---------------- */
  .flight-glass {
    position: relative;
    isolation: isolate;
    padding: clamp(14px, 1.9vw, 22px);
    border-radius: 26px;
    border: 1px solid rgba(96, 210, 170, .30);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(74, 205, 158, .22), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(24, 132, 108, .20), transparent 70%),
      linear-gradient(135deg, rgba(11, 64, 52, .60), rgba(6, 40, 36, .42) 52%, rgba(13, 68, 56, .56));
    box-shadow:
      0 26px 64px rgba(2, 20, 16, .46),
      inset 0 1px 0 rgba(190, 255, 228, .16),
      inset 0 0 70px rgba(24, 124, 98, .12);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
  }
  .flight-glass::before {
    content: "";
    position: absolute;
    top: 0; left: 7%; right: 7%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(176, 255, 222, .62), transparent);
    pointer-events: none;
  }
  .flight-glass::after {
    content: "";
    position: absolute;
    right: 0; bottom: 0;
    width: 78%; height: 100%;
    border-radius: inherit;
    background: radial-gradient(circle at 100% 100%, rgba(46, 178, 136, .20), transparent 68%);
    pointer-events: none;
    z-index: -1;
  }
  .flight-glass > .boards { position: relative; z-index: 1; }
  .flight-glass .acc {
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-color: rgba(120, 205, 176, .22);
  }
  .flight-glass .acc.is-open {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }
  html[data-theme="light"] .flight-glass {
    border-color: rgba(15, 118, 92, .26);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(70, 190, 150, .20), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(28, 142, 112, .13), transparent 70%),
      linear-gradient(135deg, rgba(214, 242, 231, .80), rgba(238, 250, 244, .62) 52%, rgba(208, 238, 227, .76));
    box-shadow:
      0 22px 52px rgba(12, 70, 56, .14),
      inset 0 1px 0 rgba(255, 255, 255, .82),
      inset 0 0 70px rgba(30, 140, 108, .07);
  }
  html[data-theme="light"] .flight-glass::before {
    background: linear-gradient(90deg, transparent, rgba(18, 128, 96, .30), transparent);
  }
  html[data-theme="light"] .flight-glass::after {
    background: radial-gradient(circle, rgba(40, 165, 125, .13), transparent 68%);
  }
  html[data-theme="light"] .flight-glass .acc {
    background: color-mix(in srgb, var(--surface) 91%, transparent);
    border-color: rgba(15, 118, 92, .18);
  }

  /* ---------------- 食品預警玻璃框（置於航班看板下方） ---------------- */
  .food-glass {
    position: relative;
    isolation: isolate;
    margin-top: clamp(18px, 2.4vw, 26px);
    padding: clamp(14px, 1.9vw, 22px);
    border-radius: 26px;
    border: 1px solid rgba(240, 128, 128, .32);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(220, 72, 72, .22), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(150, 32, 40, .20), transparent 70%),
      linear-gradient(135deg, rgba(78, 24, 30, .54), rgba(46, 16, 20, .42) 52%, rgba(78, 24, 30, .52));
    box-shadow:
      0 26px 64px rgba(28, 4, 8, .44),
      inset 0 1px 0 rgba(255, 200, 200, .16),
      inset 0 0 70px rgba(220, 72, 72, .10);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
  }
  .food-glass::before {
    content: "";
    position: absolute;
    top: 0; left: 7%; right: 7%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 176, 176, .55), transparent);
    pointer-events: none;
  }
  .food-glass > .acc { position: relative; z-index: 1; }
  .food-glass .acc {
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-color: rgba(240, 128, 128, .24);
  }
  .food-glass .acc.is-open { border-color: color-mix(in srgb, var(--food-accent) 48%, var(--border)); }
  .acc-ico.food {
    background: color-mix(in srgb, var(--food-accent) 15%, transparent);
    color: var(--food-accent);
    border-color: color-mix(in srgb, var(--food-accent) 28%, transparent);
  }
  html[data-theme="light"] .food-glass {
    border-color: rgba(184, 68, 60, .26);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(232, 120, 112, .22), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(200, 90, 80, .14), transparent 70%),
      linear-gradient(135deg, rgba(255, 242, 240, .84), rgba(253, 248, 247, .66) 52%, rgba(252, 236, 233, .80));
    box-shadow:
      0 22px 52px rgba(92, 24, 24, .14),
      inset 0 1px 0 rgba(255, 255, 255, .82),
      inset 0 0 70px rgba(184, 68, 60, .07);
  }
  html[data-theme="light"] .food-glass .acc {
    background: color-mix(in srgb, var(--surface) 91%, transparent);
    border-color: rgba(184, 68, 60, .20);
  }

  /* ---------------- 雙欄看板 ---------------- */
  .boards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
    gap: clamp(14px, 2vw, 20px);
    align-items: start;
  }
  .acc-ico.dep svg { transform: rotate(90deg); }

  /* ---------------- 開闔卡片 ---------------- */
  .acc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color .2s;
  }
  .acc.is-open { border-color: color-mix(in srgb, var(--accent) 34%, var(--border)); }

  .acc-head { margin: 0; font-size: inherit; font-weight: inherit; }
  .acc-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 16px 18px;
    background: transparent;
    border: 0;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color .18s;
  }
  .acc-btn:hover { background: color-mix(in srgb, var(--surface-2) 62%, transparent); }

  .acc-ico {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  }
  .acc-ico svg { width: 17px; height: 17px; }

  .acc-titles { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  .acc-title {
    font-size: clamp(17.5px, 2.1vw, 20px);
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.35;
  }
  .acc-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }

  .acc-state {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--accent);
    font-size: 12px; font-weight: 700; letter-spacing: .12em;
  }
  .acc-state i {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }

  .acc-chev {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    color: var(--faint);
    transition: transform .34s cubic-bezier(.4, 0, .2, 1), color .18s;
  }
  .acc-chev svg { width: 15px; height: 15px; }
  .acc.is-open .acc-chev { transform: rotate(180deg); color: var(--accent); }

  .acc-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .4s cubic-bezier(.4, 0, .2, 1);
  }
  .acc.is-open .acc-panel { grid-template-rows: 1fr; }
  .acc-panel-in {
    overflow: hidden;
    min-height: 0;
  }
  .acc-body {
    padding: 4px clamp(14px, 2.4vw, 20px) 20px;
    border-top: 1px solid var(--border-soft);
    margin-top: 2px;
    padding-top: 20px;
  }

  .acc-note {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 14px 2px 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--faint);
  }
  .acc-note svg { flex: none; width: 14px; height: 14px; margin-top: 2px; }

  /* ---------------- 頁尾 ---------------- */
  .site-footer {
    margin-top: clamp(36px, 6vw, 60px);
    padding: 22px 0 34px;
    border-top: 1px solid var(--border-soft);
    font-size: 13.5px;
    color: var(--faint);
  }
  .footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .footer-inner p { margin: 0; max-width: 66ch; line-height: 1.7; }
  .footer-tag {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: auto;
    color: var(--muted);
    font-size: 13.5px; font-weight: 600; letter-spacing: .06em;
    white-space: nowrap;
  }
  .footer-tag .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .site-footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .site-footer a:hover { color: var(--accent); }

  @media (max-width: 560px) {
    :root { --header-h: 56px; }
    .header-inner { min-height: 56px; gap: 8px; }
    .header-right { gap: 8px; }
    .brand-text small { display: none; }
    .macau-clock small { display: none; }
    .macau-clock { font-size: 15.5px; }
    .refresh-btn { width: 32px; height: 32px; }
    .refresh-btn svg { width: 15px; height: 15px; }
    .view-tabs {
      padding-block: 8px;
      gap: 7px;
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scroll-padding-inline: clamp(16px, 4vw, 32px);
      scrollbar-width: none;
    }
    .view-tabs::-webkit-scrollbar { display: none; }
    .view-tab { padding: 7px 12px; font-size: 13.5px; scroll-snap-align: start; }
    .footer-tag { font-size: 12px; }
    .acc-btn { padding: 14px 13px; gap: 10px; align-items: flex-start; }
    .acc-ico { width: 30px; height: 30px; border-radius: 9px; margin-top: 1px; }
    .acc-ico svg { width: 15px; height: 15px; }
    .acc-state { display: none; }
    .acc-chev { margin-top: 3px; }
    .acc-body { padding: 16px 12px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

    .addr { margin-top: 5px; display: flex; align-items: flex-start; gap: 5px; font-size: 12px; color: var(--c-muted); }

    .addr span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .meta { margin-top: 5px; font-size: 11px; color: var(--c-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta a { color: var(--c-accent-2); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .meta i { margin: 0 6px; font-style: normal; opacity: .6; }
    .foot { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .addr-en { min-width: 0; font-size: 10.5px; color: var(--c-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .links { flex: none; display: flex; gap: 9px; }
    .links a { font-size: 11.5px; color: var(--c-accent-2); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    /* 初始提示只是文字，不加外框，避免與搜尋框連成一體 */
    .hint { grid-column: 1 / -1; padding: 4px 4px 6px; text-align: center; color: var(--c-faint);
      font-size: 13px; border: 0; background: none; }
    .empty { grid-column: 1 / -1; padding: 26px 12px; text-align: center; color: var(--c-muted);
      font-size: 13.5px; border: 1px dashed var(--c-line); border-radius: 14px; }
    .more { position: relative; z-index: 1; display: block; margin: 14px auto 0; padding: 8px 18px;
      border: 1px solid var(--c-line); border-radius: 999px; background: var(--c-tile-2);
      color: var(--c-text); font: inherit; font-size: 13px; cursor: pointer; }
    .more:hover { border-color: var(--c-accent); color: var(--c-accent); }
    /* 搜尋框吸附：頁面捲動時只有下方資料移動；僅在吸附時鋪底，平時不顯示色塊 */
    .tools { position: sticky; top: var(--sticky-top, 124px); z-index: 3; padding: 12px var(--pad) 10px; }
    .tools.is-pinned {
      background: linear-gradient(180deg, rgba(9, 45, 38, .97) 0%, rgba(9, 45, 38, .97) 84%, rgba(9, 45, 38, 0) 100%); }
    :host([data-theme="light"]) .tools.is-pinned {
      background: linear-gradient(180deg, rgba(233, 249, 241, .97) 0%, rgba(233, 249, 241, .97) 84%, rgba(233, 249, 241, 0) 100%); }
    /* 框外元素沿用原本的水平內縮，維持相對位置 */
    .notice { margin-left: var(--pad); margin-right: var(--pad); }
    .result { margin-top: 0; }
    /* 作者樣式的 display:block 會蓋過 hidden 屬性，需收回來 */
    .more[hidden] { display: none !important; }
    /* 整組往右延伸到距卡片右邊線 8px，讓最長一行（市政署）貼近邊線 */
    .srcs { position: relative; z-index: 1; margin-top: 18px; padding-top: 12px;
      margin-right: calc(8px - clamp(16px, 2.2vw, 24px));
      border-top: 1px solid var(--c-line);
      display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; }
    /* 名稱與間數同一行，整組自右側 1/4 處起排 */
    .src-row { grid-column: 2; display: flex; align-items: baseline; gap: 10px;
      text-decoration: none; white-space: nowrap; }
    .src-name { font-size: 12.5px; color: var(--c-muted); border-bottom: 1px dotted currentColor; }
    .src-row:hover .src-name { color: var(--c-accent); }
    .src-meta { font-size: 12.5px; color: var(--c-faint); font-variant-numeric: tabular-nums; }
    .src-meta b { color: var(--c-muted); }
    /* 手機：置中且不換行 */
    @container (max-width: 560px) {
      .srcs { grid-template-columns: minmax(0, 1fr); margin-right: 0; }
      .src-row { grid-column: 1; justify-content: center; }
      .src-name, .src-meta { font-size: 11.5px; }
    }
    @container (max-width: 620px) { .list { grid-template-columns: minmax(0, 1fr); } }
    @container (max-width: 360px) {
      .cat { width: 54px; }
      .place { gap: 9px; padding: 10px; }
      .line h3 { font-size: 14px; }
    }
  `;

  class MacauRegistryWidget extends HTMLElement {
    static get observedAttributes() { return ['refresh', 'theme', 'title', 'limit']; }

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this._iam = [];
      this._dst = [];
      this._all = [];
      this._q = '';
      this._qRaw = '';
      this._limit = PAGE_SIZE;
      this._updatedAt = null;
      this._loaded = false;
      this._notice = '';
      this._loading = false;
      this._timer = null;
      this._shelled = false;
      this._tools = null;
      this._onWinScroll = null;
      var self = this;
      this.shadowRoot.addEventListener('click', function (e) { self._onClick(e); });
      this.shadowRoot.addEventListener('input', function (e) { self._onInput(e); });
    }

    get cfg() {
      var a = this.getAttribute.bind(this);
      return {
        title: a('title') || '旅遊局｜市政署牌照場所',
        theme: a('theme') || 'dark',
        refresh: clampInt(a('refresh'), 30, 3600, 300),
        limit: clampInt(a('limit'), 4, 60, PAGE_SIZE)
      };
    }

    connectedCallback() {
      if (this._shelled) return;
      this._shelled = true;
      this._cfg = this.cfg;
      if (this.getAttribute('data-theme') !== this._cfg.theme) this.setAttribute('data-theme', this._cfg.theme);
      this._limit = this._cfg.limit;
      this._shell();
      this._paint();
      this._startTimer();
      this.refresh();
    }

    disconnectedCallback() {
      clearInterval(this._timer);
      if (this._onWinScroll) {
        window.removeEventListener('scroll', this._onWinScroll);
        window.removeEventListener('resize', this._onWinScroll);
        this._onWinScroll = null;
      }
    }

    attributeChangedCallback(name, oldVal, newVal) {
      if (oldVal === newVal || !this._shelled) return;
      this._cfg = this.cfg;
      if (name === 'theme') {
        if (this.getAttribute('data-theme') !== this._cfg.theme) this.setAttribute('data-theme', this._cfg.theme);
      } else if (name === 'refresh') {
        this._startTimer();
      } else if (name === 'title') {
        var t = this.shadowRoot.querySelector('[data-title]');
        if (t) t.textContent = this._cfg.title;
      } else if (name === 'limit') {
        this._limit = this._cfg.limit;
        this._paintList();
      }
    }

    _startTimer() {
      clearInterval(this._timer);
      var self = this;
      this._timer = setInterval(function () { self.refresh(); }, this._cfg.refresh * 1000);
    }

    _shell() {
      this.shadowRoot.innerHTML = '<style>' + STYLE + '</style>' +
        '<div class="card">' +
          '<div class="hd"><div><h2><i class="pip"></i><span data-title></span></h2></div>' +
          '<span class="badge" data-badge>載入中…</span></div>' +
          '<div class="notice" data-notice hidden></div>' +
          '<div class="tools"><label class="search">' + searchIcon() +
            '<input type="search" data-search placeholder="搜尋場所名稱／地址／電話／類別" aria-label="搜尋旅遊局及市政署牌照場所">' +
            '</label></div>' +
          '<div class="panel">' +
            '<div class="result" data-result></div>' +
            '<div class="list" data-list></div>' +
            '<button class="more" type="button" data-more hidden></button>' +
            '<div class="srcs" data-sources></div>' +
          '</div>' +
        '</div>';
      this._tools = this.shadowRoot.querySelector('.tools');
      if (this._tools && !this._onWinScroll) {
        var self = this;
        this._onWinScroll = function () { self._updatePin(); };
        window.addEventListener('scroll', this._onWinScroll, { passive: true });
        window.addEventListener('resize', this._onWinScroll);
      }
      var t = this.shadowRoot.querySelector('[data-title]');
      if (t) t.textContent = this._cfg.title;
      var input = this.shadowRoot.querySelector('[data-search]');
      if (input) input.value = this._qRaw;
    }

    refresh() {
      if (this._loading) return;
      var self = this;
      this._loading = true;

      var iamTask = fetch(DINING_API, {
        headers: { 'Authorization': 'APPCODE ' + APPCODE, 'Accept': 'application/json' }
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (j) {
        var arr = Array.isArray(j) ? j : (j && Array.isArray(j.data) ? j.data : []);
        var rows = arr.map(normalizeIam).filter(Boolean);
        if (!rows.length) throw new Error('沒有資料');
        return rows;
      }).then(function (rows) { return { ok: true, rows: rows }; },
              function (err) { return { ok: false, err: err.message }; });

      var dstTask = Promise.all(DST_SOURCES.map(function (s) {
        return fetch(s.api, {
          headers: { 'Authorization': 'APPCODE ' + APPCODE, 'Accept': 'application/xml' }
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        }).then(function (text) { return parseDstXml(text, s.cat); })
          .then(function (rows) { return { id: s.cat, ok: true, rows: rows }; },
                function (err) { return { id: s.cat, ok: false, err: err.message }; });
      })).then(function (res) {
        var merged = [], failed = [], anyOk = false;
        res.forEach(function (r) {
          if (r.ok) { anyOk = true; merged = merged.concat(r.rows); }
          else failed.push(r.id + '（' + r.err + '）');
        });
        return { ok: anyOk, rows: merged, failed: failed };
      });

      Promise.all([iamTask, dstTask]).then(function (res) {
        var iamRes = res[0], dstRes = res[1];
        if (iamRes.ok) self._iam = iamRes.rows;
        if (dstRes.ok) self._dst = dstRes.rows;
        self._all = self._iam.concat(self._dst);
        self._all.forEach(function (r, i) { r._k = i; });
        self._loaded = true;

        var fails = [];
        if (!iamRes.ok) fails.push('市政署（' + iamRes.err + '）');
        if (dstRes.failed.length) fails.push('旅遊局 ' + dstRes.failed.join('、'));

        if (fails.length && !self._all.length) {
          self._notice = '無法連接官方資料來源（' + esc(fails.join('；')) + '）。' +
            '<button type="button" data-retry>重試</button>';
        } else if (fails.length) {
          self._notice = '部分來源暫時無法連接（' + esc(fails.join('；')) + '），顯示上次成功取得的資料。' +
            '<button type="button" data-retry>重試</button>';
        } else {
          self._notice = '';
        }

        if (iamRes.ok || dstRes.ok) self._updatedAt = Date.now();
        self._paint();

        self.dispatchEvent(new CustomEvent('macau-registry:update', {
          bubbles: true, composed: true,
          detail: {
            count: self._all.length,
            iam: self._iam.length,
            dst: self._dst.length,
            updatedAt: self._updatedAt
          }
        }));
        if (fails.length) {
          self.dispatchEvent(new CustomEvent('macau-registry:error', {
            bubbles: true, composed: true, detail: { message: fails.join('；') }
          }));
        }
      }).catch(function (err) {
        self._notice = '讀取資料時發生錯誤（' + esc(err.message) + '）。' +
          '<button type="button" data-retry>重試</button>';
        self._paint();
        self.dispatchEvent(new CustomEvent('macau-registry:error', {
          bubbles: true, composed: true, detail: { message: err.message }
        }));
      }).then(function () {
        self._loading = false;
      });
    }

    _filtered() {
      var q = this._q;
      if (!q) return [];
      function score(r) {
        var names = [r.zh, r.en, r.pt];
        if (names.some(function (v) { return String(v || '').toLowerCase() === q; })) return 0;
        if (names.some(function (v) { return String(v || '').toLowerCase().indexOf(q) === 0; })) return 1;
        if (names.some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return 2;
        return 3;
      }
      return this._all.filter(function (r) {
        return [r.cat, r.zh, r.en, r.pt, r.addr, r.addrAlt, r.area, r.tel, r.site,
          r.cuisine, r.hours, r.email].some(function (v) {
          return String(v || '').toLowerCase().indexOf(q) >= 0;
        });
      }).sort(function (a, b) {
        return (score(a) - score(b)) || ((a._k || 0) - (b._k || 0));
      });
    }

    _paint() {
      var total = this._all.length;
      var badge = this.shadowRoot.querySelector('[data-badge]');
      if (badge) badge.textContent = this._loaded ? num(total) + ' 間場所' : '載入中…';
      var notice = this.shadowRoot.querySelector('[data-notice]');
      if (notice) { notice.innerHTML = this._notice || ''; notice.hidden = !this._notice; }
      this._paintList();
      this._paintSources();
      this._updatePin();
    }

    _paintList() {
      var list = this.shadowRoot.querySelector('[data-list]');
      var result = this.shadowRoot.querySelector('[data-result]');
      var more = this.shadowRoot.querySelector('[data-more]');
      if (!this._q) {
        if (list) list.innerHTML = '<div class="hint">輸入場所名稱、地址、電話或類別，開始搜尋…</div>';
        if (result) result.textContent = '';
        if (more) more.hidden = true;
        return;
      }
      var rows = this._filtered();
      var shown = Math.min(this._limit, rows.length);
      if (list) {
        list.innerHTML = rows.length
          ? rows.slice(0, shown).map(itemHtml).join('')
          : '<div class="empty">找不到符合「' + esc(this._qRaw) + '」的場所，試試其他關鍵字。</div>';
      }
      if (result) {
        result.textContent = rows.length
          ? '符合「' + this._qRaw + '」的場所共 ' + num(rows.length) + ' 間 · 顯示 ' + num(shown)
          : '沒有符合條件的場所';
      }
      if (more) {
        more.hidden = shown >= rows.length;
        more.textContent = '顯示更多（尚有 ' + num(rows.length - shown) + ' 間）';
      }
    }

    /* 搜尋框吸附到頁首／分類列下方時才鋪底，未吸附時保持透明 */
    _updatePin() {
      var t = this._tools;
      if (!t) return;
      var top = parseFloat(getComputedStyle(t).top) || 0;
      var r = t.getBoundingClientRect();
      t.classList.toggle('is-pinned', r.top <= top + 1 && r.bottom > 0);
    }

    /* 連結名稱與間數同一行，整組自右側 1/4 處起排 */
    _paintSources() {
      var box = this.shadowRoot.querySelector('[data-sources]');
      if (!box) return;
      var self = this;
      box.innerHTML = LINKS.map(function (l) {
        var n = l.key === 'iam' ? self._iam.length : self._dst.length;
        var cnt = self._loaded ? '共 <b>' + num(n) + '</b> 間' : '載入中…';
        return '<a class="src-row" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer"' +
          ' title="' + esc(l.href) + '">' +
          '<span class="src-name">' + esc(l.name) + ' ↗</span>' +
          '<span class="src-meta">' + cnt + '</span></a>';
      }).join('');
    }

    _onClick(e) {
      var t = e.target && e.target.closest ? e.target.closest('[data-more],[data-retry]') : null;
      if (!t) return;
      if (t.hasAttribute('data-more')) {
        this._limit += this._cfg.limit;
        this._paintList();
      } else if (t.hasAttribute('data-retry')) {
        this.refresh();
      }
    }

    _onInput(e) {
      if (!e.target || !e.target.matches || !e.target.matches('[data-search]')) return;
      this._qRaw = clean(e.target.value);
      this._q = this._qRaw.toLowerCase();
      this._limit = this._cfg.limit;
      this._paintList();
    }
  }

  window.customElements.define('macau-registry-widget', MacauRegistryWidget);
})();
</script>

<script>
(function () {
  'use strict';

  var root = document.documentElement;
  var acc = document.getElementById('arrivals-acc');
  var btn = document.getElementById('arrivals-btn');
  var panel = document.getElementById('arrivals-panel');
  var widgets = document.querySelectorAll('macau-tour-widget, macau-registry-widget');
  var STORE_THEME = 'macau-info-theme';

  /* ---------- 全站自動重整：所有元件統一每 5 分鐘一次 ----------
     各 widget 以秒為單位的 refresh 屬性驅動自己的計時器；此處統一設定，
     讓頁面載入後各元件的計時起點對齊，日後調整週期只需改這一個常數。 */
  var AUTO_REFRESH_SEC = 300;
  Array.prototype.forEach.call(widgets, function (w) {
    if (w.getAttribute('refresh') !== String(AUTO_REFRESH_SEC)) {
      w.setAttribute('refresh', String(AUTO_REFRESH_SEC));
    }
  });

  /* ---------- 全站唯一的重新整理按鈕 ----------
     一次觸發所有元件同時重整；並把各元件的計時器歸零，
     讓下一次自動重整由這次手動更新起算，避免短時間內重複抓取。 */
  var refreshBtn = document.getElementById('global-refresh');
  var refreshLabel = refreshBtn.querySelector('[data-refresh-label]');
  var SETTLE_EVENTS = [
    'macau-tour:update', 'macau-tour:error',
    'macau-registry:update', 'macau-registry:error'
  ];
  var refreshing = false;

  function refreshAll() {
    if (refreshing) return;
    refreshing = true;
    var started = Date.now();
    refreshBtn.disabled = true;
    refreshBtn.classList.add('is-busy');
    refreshBtn.setAttribute('aria-busy', 'true');
    refreshLabel.textContent = '更新中…';

    var pending = widgets.length, seen = {}, finished = false, guard = null;

    function onSettle(e) {
      var key = e.type.replace(/:(update|error)$/, '');
      if (seen[key]) return;
      seen[key] = true;
      if (--pending <= 0) finish();
    }

    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      SETTLE_EVENTS.forEach(function (n) { document.removeEventListener(n, onSettle); });
      /* 至少轉動 0.7 秒，讓使用者看得到更新回饋 */
      var wait = Math.max(0, 700 - (Date.now() - started));
      setTimeout(function () {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('is-busy');
        refreshBtn.removeAttribute('aria-busy');
        refreshLabel.textContent = '重新整理';
        try {
          var f = new Intl.DateTimeFormat('zh-Hant', {
            timeZone: 'Asia/Macau', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          });
          refreshBtn.title = '上次更新：' + f.format(new Date()) + '（澳門時間）· 重新整理全部資訊';
        } catch (e) {
          refreshBtn.title = '重新整理全部資訊';
        }
        refreshing = false;
      }, wait);
    }

    SETTLE_EVENTS.forEach(function (n) { document.addEventListener(n, onSettle); });
    /* 若某元件正在載入而提前返回（不發事件），最多 5 秒後仍解除鎖定 */
    guard = setTimeout(finish, 5000);

    Array.prototype.forEach.call(widgets, function (w) {
      if (typeof w.refresh === 'function') w.refresh();
      /* 先設為不同值再設回，觸發各元件的 attributeChangedCallback 重啟計時器 */
      w.setAttribute('refresh', String(AUTO_REFRESH_SEC + 1));
      w.setAttribute('refresh', String(AUTO_REFRESH_SEC));
    });
  }

  refreshBtn.addEventListener('click', refreshAll);

  /* ---------- 主題 ---------- */
  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#eef3fa' : '#080e19');
    Array.prototype.forEach.call(widgets, function (w) { w.setAttribute('theme', theme); });
    var t = document.getElementById('theme-toggle');
    if (t) t.setAttribute('aria-label', theme === 'light' ? '切換為深色模式' : '切換為淺色模式');
  }

  var saved = null;
  try { saved = localStorage.getItem(STORE_THEME); } catch (e) {}
  if (!saved) {
    saved = 'dark';
  }
  applyTheme(saved);

  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(STORE_THEME, next); } catch (e) {}
  });

  /* ---------- 開闔（各區塊各自獨立，預設收合） ---------- */
  function setAccOpen(acc, open) {
    var btn = acc.querySelector('.acc-btn');
    var panel = acc.querySelector('.acc-panel');
    acc.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) panel.removeAttribute('inert');
    else panel.setAttribute('inert', '');
  }

  Array.prototype.forEach.call(document.querySelectorAll('.acc'), function (acc) {
    var btn = acc.querySelector('.acc-btn');
    var panel = acc.querySelector('.acc-panel');

    setAccOpen(acc, false);

    btn.addEventListener('click', function () {
      setAccOpen(acc, !acc.classList.contains('is-open'));
    });

    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        btn.click();
      }
    });

    /* 以 #區塊id 或 #面板id 進入時自動展開該區塊 */
    if (location.hash === '#' + acc.id || location.hash === '#' + panel.id) setAccOpen(acc, true);
  });

  /* ---------- 分類切換（預設只顯示「牌照場所」） ----------
     其餘分類的資料必須按下對應按鈕才會出現；切換時一併展開該分類的卡片，
     讓使用者按一次就能看到內容，不必再逐張點開。 */
  var VIEWS = ['registry', 'tour'];
  var viewButtons = document.querySelectorAll('.view-tab');
  var viewPanels = document.querySelectorAll('[data-view-panel]');

  function setView(name, keepCollapsed) {
    if (VIEWS.indexOf(name) < 0) name = 'registry';
    Array.prototype.forEach.call(viewButtons, function (b) {
      var on = b.getAttribute('data-view') === name;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(viewPanels, function (p) {
      p.hidden = p.getAttribute('data-view-panel') !== name;
    });
    /* 手機按鈕列可橫向捲動時，讓目前分類的按鈕保持在可視範圍 */
    var tabs = document.querySelector('.view-tabs');
    var active = document.querySelector('.view-tab.is-active');
    if (tabs && active && tabs.scrollWidth > tabs.clientWidth && active.scrollIntoView) {
      active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }
    if (!keepCollapsed) {
      Array.prototype.forEach.call(
        document.querySelectorAll('[data-view-panel="' + name + '"] .acc'),
        function (acc) { setAccOpen(acc, true); }
      );
    }
  }

  Array.prototype.forEach.call(viewButtons, function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
  });

  var initialView = 'registry';
  var viewHash = (location.hash || '').replace(/^#/, '');
  if (VIEWS.indexOf(viewHash) >= 0) {
    initialView = viewHash;
  } else {
    var hashTarget = viewHash && document.getElementById(viewHash);
    var owner = hashTarget && hashTarget.closest ? hashTarget.closest('[data-view-panel]') : null;
    if (owner) initialView = owner.getAttribute('data-view-panel');
  }
  setView(initialView, true);

  /* ---------- 澳門時鐘 ---------- */
  var clockEl = document.getElementById('header-clock');
  var fmt = null;
  try {
    fmt = new Intl.DateTimeFormat('zh-Hant', {
      timeZone: 'Asia/Macau', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  } catch (e) {}

  function tick() {
    var now = new Date();
    if (fmt) {
      clockEl.textContent = fmt.format(now);
    } else {
      var d = new Date(now.getTime() + 8 * 3600 * 1000);
      function p(n) { return String(n).padStart(2, '0'); }
      clockEl.textContent = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
    }
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- 小工具狀態（無障礙提示） ---------- */
  ['macau-tour:error', 'macau-registry:error'].forEach(function (name) {
    document.addEventListener(name, function (e) {
      if (window.console) console.warn('[' + name + '] 資料更新失敗：', e.detail && e.detail.message);
    });
  });

  /* ---------- 展開資料時維持捲動位置 ----------
     各清單按「顯示更多／顯示全部／更多」時會重建列表 DOM，部分瀏覽器
     （尤其手機）會在內容高度變動後把捲動位置重算回頁首。此處於捕獲
     階段記下點按當下的位置，待元件重繪完成後分三個時間點還原，讓新
     資料在使用者原本停留的位置往下展開，而不是跳回上方。 */
  (function () {
    var EXPAND = '[data-more],[data-more-btn],[data-focus-more]';
    var userMoved = false;

    /* 還原期間若使用者自己捲動，就放棄鎖定，不與使用者搶捲動控制權 */
    ['wheel', 'touchmove', 'keydown'].forEach(function (n) {
      window.addEventListener(n, function () { userMoved = true; }, { passive: true });
    });

    function isExpand(node) {
      return !!(node && node.nodeType === 1 && node.matches && node.matches(EXPAND));
    }
    function findExpand(e) {
      var path = e.composedPath ? e.composedPath() : [];
      for (var i = 0; i < path.length; i++) {
        if (isExpand(path[i])) return path[i];
      }
      return isExpand(e.target) ? e.target : null;
    }
    function restore(y) {
      if (userMoved) return;
      /* 已在同一位置就不干預，避免影響使用者當下的捲動操作 */
      if (Math.abs(window.pageYOffset - y) < 1) return;
      window.scrollTo(0, y);
    }

    document.addEventListener('click', function (e) {
      if (!findExpand(e)) return;
      userMoved = false;
      var y = window.pageYOffset;
      /* 捕獲階段只登記；元件自己的重繪會在冒泡階段接續執行 */
      requestAnimationFrame(function () {
        restore(y);
        requestAnimationFrame(function () { restore(y); });
      });
      setTimeout(function () { restore(y); }, 80);
    }, true);
  })();
})();
</script>
<script>
/* ---------- 卡片內搜尋框的吸附位置 ----------
   頁首與分類列都是 sticky，分類列會隨視窗寬度換行而改變高度，
   因此量測兩者實際高度後寫入 --sticky-top，供各元件 .tools 使用。 */
(function () {
  var root = document.documentElement;
  var header = document.querySelector('.site-header');
  var tabs = document.querySelector('.view-tabs');
  if (!root || !tabs) return;

  function sync() {
    var h = (header ? header.getBoundingClientRect().height : 0) +
            tabs.getBoundingClientRect().height;
    root.style.setProperty('--sticky-top', Math.round(h) + 'px');
  }

  sync();
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(sync);
    if (header) ro.observe(header);
    ro.observe(tabs);
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', sync);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
})();
</script>
</body>
